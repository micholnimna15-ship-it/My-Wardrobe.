<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Wardrobe">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <title>My Wardrobe</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f6;
      color: #111;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    #authScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #111, #333);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px 14px;
      background: #fafafa;
      outline: none;
    }

    input:focus {
      border-color: #111;
      background: white;
    }

    .primary-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 5px;
    }

    .primary-btn:active {
      transform: scale(.98);
    }

    .secondary-btn {
      border: 1px solid #ddd;
      background: white;
      color: #111;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }

    .auth-switch {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }

    .auth-switch button {
      border: none;
      background: none;
      color: #111;
      font-weight: 700;
      padding: 0;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      display: block;
      background: #ffe7e7;
      color: #a00000;
    }

    .message.success {
      display: block;
      background: #e7f8ec;
      color: #176b2c;
    }

    /* APP */

    #appScreen {
      min-height: 100vh;
      padding-bottom: 85px;
    }

    .topbar {
      background: white;
      padding: 18px 18px 15px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid #eee;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .app-title {
      font-size: 25px;
      font-weight: 800;
    }

    .user-email {
      color: #888;
      font-size: 12px;
      margin-top: 3px;
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout-btn {
      border: none;
      background: #f1f1f1;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
    }

    .content {
      padding: 18px;
      max-width: 900px;
      margin: auto;
    }

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      background: white;
      border-radius: 14px;
      padding: 14px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-size: 20px;
      margin: 0;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 650px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .category-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      min-height: 125px;
      border: 1px solid #eee;
      position: relative;
    }

    .category-main {
      cursor: pointer;
    }

    .category-icon {
      font-size: 35px;
      margin-bottom: 8px;
    }

    .category-name {
      font-size: 17px;
      font-weight: 750;
    }

    .category-count {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }

    .category-actions {
      position: absolute;
      right: 8px;
      top: 8px;
      display: flex;
      gap: 3px;
    }

    .icon-btn {
      border: none;
      background: #f2f2f2;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 14px;
    }

    .add-category-card {
      background: #111;
      color: white;
      border-radius: 18px;
      padding: 18px;
      min-height: 125px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
    }

    /* CLOTHES */

    .back-btn {
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 15px;
      font-weight: 700;
      font-size: 15px;
    }

    .category-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .category-header h2 {
      margin: 0;
      font-size: 23px;
    }

    .clothes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    @media (min-width: 650px) {
      .clothes-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .clothing-card {
      background: white;
      border-radius: 17px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .clothing-photo {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #eee;
      display: block;
    }

    .no-photo {
      width: 100%;
      aspect-ratio: 1;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .clothing-info {
      padding: 11px;
    }

    .clothing-name {
      font-weight: 750;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .clothing-detail {
      color: #777;
      font-size: 12px;
      margin-bottom: 3px;
    }

    .delete-clothing {
      border: none;
      background: #ffe9e9;
      color: #a00000;
      border-radius: 8px;
      padding: 7px 9px;
      font-size: 11px;
      margin-top: 8px;
    }

    /* LOOKS */

    .look-card {
      background: white;
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #eee;
    }

    .look-title {
      font-size: 17px;
      font-weight: 750;
      margin-bottom: 12px;
    }

    .look-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .look-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .look-item-name {
      font-size: 10px;
      margin-top: 4px;
      color: #666;
    }

    .empty {
      background: white;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      color: #888;
      border: 1px solid #eee;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 8px 5px calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }

    .nav-btn {
      border: none;
      background: none;
      color: #888;
      font-size: 11px;
      text-align: center;
      min-width: 75px;
      padding: 5px;
    }

    .nav-btn.active {
      color: #111;
      font-weight: 750;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-card {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 22px;
    }

    @media (min-width: 650px) {
      .modal {
        align-items: center;
        padding: 20px;
      }

      .modal-card {
        border-radius: 20px;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      border: none;
      background: #eee;
      width: 34px;
      height: 34px;
      border-radius: 50%;
    }

    .photo-preview {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 15px;
      display: block;
      margin: 10px 0;
      background: #eee;
    }

    .emoji-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .emoji-option {
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      width: 45px;
      height: 45px;
      font-size: 22px;
    }

    .emoji-option.selected {
      border: 2px solid #111;
      background: #f2f2f2;
    }

    .danger-btn {
      width: 100%;
      border: none;
      background: #ffe7e7;
      color: #a00000;
      padding: 13px;
      border-radius: 12px;
      font-weight: 700;
      margin-top: 10px;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }

    .spinner {
      margin: auto auto 15px;
      width: 35px;
      height: 35px;
      border: 4px solid #ddd;
      border-top-color: #111;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- ========================= -->
  <!-- LOGIN / SIGN UP SCREEN -->
  <!-- ========================= -->

  <div id="authScreen">

    <div class="auth-card">

      <div class="logo">👕 My Wardrobe</div>
      <div class="auth-subtitle">Your clothes. Your account. Your wardrobe.</div>

      <div id="authMessage" class="message"></div>

      <!-- LOGIN -->

      <div id="loginForm">

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
          >
        </div>

        <button class="primary-btn" onclick="login()">
          Login
        </button>

        <div class="auth-switch">
          Don't have an account?
          <button onclick="showSignup()">Create account</button>
        </div>

      </div>


      <!-- SIGN UP -->

      <div id="signupForm" class="hidden">

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            autocomplete="new-password"
          >
        </div>

        <div class="form-group">
          <label>Confirm password</label>
          <input
            type="password"
            id="signupConfirm"
            placeholder="Confirm your password"
            autocomplete="new-password"
          >
        </div>

        <button class="primary-btn" onclick="signup()">
          Create Account
        </button>

        <div class="auth-switch">
          Already have an account?
          <button onclick="showLogin()">Login</button>
        </div>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- MAIN APP -->
  <!-- ========================= -->

  <div id="appScreen" class="hidden">

    <div class="topbar">

      <div class="topbar-row">

        <div>
          <div class="app-title">My Wardrobe</div>
          <div id="userEmail" class="user-email"></div>
        </div>

        <button class="logout-btn" onclick="logout()">
          Logout
        </button>

      </div>

    </div>


    <main class="content">

      <!-- HOME -->

      <section id="homePage">

        <div class="search-box">
          <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search your clothes..."
            oninput="searchClothes()"
          >
        </div>

        <div class="section-title">
          <h2>My Categories</h2>
        </div>

        <div id="categoryGrid" class="category-grid"></div>

      </section>


      <!-- CATEGORY PAGE -->

      <section id="categoryPage" class="hidden">

        <button class="back-btn" onclick="goHome()">
          ← Back to categories
        </button>

        <div class="category-header">

          <h2 id="currentCategoryName"></h2>

          <button
            class="secondary-btn"
            onclick="openAddClothingModal()"
          >
            + Add Clothes
          </button>

        </div>

        <div id="clothesGrid" class="clothes-grid"></div>

      </section>


      <!-- SEARCH PAGE -->

      <section id="searchPage" class="hidden">

        <div class="section-title">
          <h2>Search Results</h2>
        </div>

        <div id="searchResults" class="clothes-grid"></div>

      </section>


      <!-- LOOKS PAGE -->

      <section id="looksPage" class="hidden">

        <div class="section-title">

          <h2>Saved Looks</h2>

          <button
            class="secondary-btn"
            onclick="createLook()"
          >
            ✨ Create Look
          </button>

        </div>

        <div id="looksContainer"></div>

      </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

      <button
        class="nav-btn active"
        id="homeNav"
        onclick="showPage('home')"
      >
        <span class="nav-icon">🏠</span>
        Home
      </button>

      <button
        class="nav-btn"
        id="lookNav"
        onclick="showPage('looks')"
      >
        <span class="nav-icon">✨</span>
        Looks
      </button>

    </nav>

  </div>


  <!-- ========================= -->
  <!-- CATEGORY MODAL -->
  <!-- ========================= -->

  <div id="categoryModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <h3 id="categoryModalTitle">
          Add Category
        </h3>

        <button class="close-btn" onclick="closeCategoryModal()">
          ✕
        </button>

      </div>

      <div class="form-group">

        <label>Category name</label>

        <input
          type="text"
          id="categoryNameInput"
          placeholder="e.g. Shirts"
        >

      </div>

      <div class="form-group">

        <label>Choose an icon</label>

        <div class="emoji-options">

          <button class="emoji-option selected" onclick="selectEmoji(this,'👕')">👕</button>
          <button class="emoji-option" onclick="selectEmoji(this,'👖')">👖</button>
          <button class="emoji-option" onclick="selectEmoji(this,'👟')">👟</button>
          <button class="emoji-option" onclick="selectEmoji(this,'🧥')">🧥</button>
          <button class="emoji-option" onclick="selectEmoji(this,'🧢')">🧢</button>
          <button class="emoji-option" onclick="selectEmoji(this,'👔')">👔</button>
          <button class="emoji-option" onclick="selectEmoji(this,'👗')">👗</button>
          <button class="emoji-option" onclick="selectEmoji(this,'🩳')">🩳</button>
          <button class="emoji-option" onclick="selectEmoji(this,'🧦')">🧦</button>
          <button class="emoji-option" onclick="selectEmoji(this,'🎒')">🎒</button>
          <button class="emoji-option" onclick="selectEmoji(this,'👜')">👜</button>
          <button class="emoji-option" onclick="selectEmoji(this,'💍')">💍</button>

        </div>

      </div>

      <button
        class="primary-btn"
        onclick="saveCategory()"
      >
        Save Category
      </button>

      <button
        id="deleteCategoryButton"
        class="danger-btn hidden"
        onclick="deleteCurrentCategory()"
      >
        Delete Category
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- CLOTHING MODAL -->
  <!-- ========================= -->

  <div id="clothingModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <h3>Add Clothing</h3>

        <button class="close-btn" onclick="closeClothingModal()">
          ✕
        </button>

      </div>

      <div class="form-group">

        <label>Photo</label>

        <input
          type="file"
          id="clothingPhoto"
          accept="image/*"
          onchange="previewPhoto()"
        >

        <img
          id="photoPreview"
          class="photo-preview hidden"
          alt="Preview"
        >

      </div>

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          id="clothingName"
          placeholder="e.g. White Oxford Shirt"
        >

      </div>

      <div class="form-group">

        <label>Colour</label>

        <input
          type="text"
          id="clothingColor"
          placeholder="e.g. White"
        >

      </div>

      <div class="form-group">

        <label>Brand (optional)</label>

        <input
          type="text"
          id="clothingBrand"
          placeholder="e.g. Nike"
        >

      </div>

      <button
        class="primary-btn"
        id="saveClothingButton"
        onclick="saveClothing()"
      >
        Add Clothing
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- CREATE LOOK MODAL -->
  <!-- ========================= -->

  <div id="lookModal" class="modal hidden">

    <div class="modal-card">

      <div class="modal-header">

        <h3>Save This Look</h3>

        <button class="close-btn" onclick="closeLookModal()">
          ✕
        </button>

      </div>

      <div id="lookPreview" class="look-items"></div>

      <div class="form-group" style="margin-top:20px;">

        <label>Look name</label>

        <input
          type="text"
          id="lookName"
          placeholder="e.g. Casual Friday"
        >

      </div>

      <button
        class="primary-btn"
        onclick="saveLook()"
      >
        Save Look
      </button>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* =====================================================
       SUPABASE CONNECTION
       ===================================================== */

    const SUPABASE_URL =
      "https://umtppiaeralgiqvefnbh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_hgrE28tw0hGmNP929kPgYw_h5aPs0ey";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =====================================================
       APP DATA
       ===================================================== */

    let currentUser = null;

    let categories = [];

    let clothes = [];

    let savedLooks = [];

    let currentCategory = null;

    let editingCategoryId = null;

    let selectedEmoji = "👕";

    let currentLookItems = [];


    /* =====================================================
       AUTH
       ===================================================== */

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session) {

        currentUser = session.user;

        await startApp();

      } else {

        showAuth();

      }

    }


    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          currentUser = session.user;

          await startApp();

        } else {

          currentUser = null;

          showAuth();

        }

      }
    );


    function showAuth() {

      document
        .getElementById("authScreen")
        .classList.remove("hidden");

      document
        .getElementById("appScreen")
        .classList.add("hidden");

    }


    function showLogin() {

      document
        .getElementById("loginForm")
        .classList.remove("hidden");

      document
        .getElementById("signupForm")
        .classList.add("hidden");

      clearAuthMessage();

    }


    function showSignup() {

      document
        .getElementById("loginForm")
        .classList.add("hidden");

      document
        .getElementById("signupForm")
        .classList.remove("hidden");

      clearAuthMessage();

    }


    function showAuthMessage(message, type) {

      const box =
        document.getElementById("authMessage");

      box.textContent = message;

      box.className =
        "message " + type;

    }


    function clearAuthMessage() {

      const box =
        document.getElementById("authMessage");

      box.textContent = "";

      box.className = "message";

    }


    async function signup() {

      const email =
        document.getElementById("signupEmail")
          .value
          .trim();

      const password =
        document.getElementById("signupPassword")
          .value;

      const confirm =
        document.getElementById("signupConfirm")
          .value;


      if (!email || !password) {

        showAuthMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showAuthMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;
      }


      if (password !== confirm) {

        showAuthMessage(
          "Passwords do not match.",
          "error"
        );

        return;
      }


      showAuthMessage(
        "Creating your account...",
        "success"
      );


      const {
        data,
        error
      } = await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {
          emailRedirectTo:
            window.location.href.split("?")[0]
        }

      });


      if (error) {

        showAuthMessage(
          error.message,
          "error"
        );

        return;
      }


      if (data.session) {

        showAuthMessage(
          "Account created successfully!",
          "success"
        );

      } else {

        showAuthMessage(
          "Account created! Please check your email and verify your account before logging in.",
          "success"
        );

      }

    }


    async function login() {

      const email =
        document.getElementById("loginEmail")
          .value
          .trim();

      const password =
        document.getElementById("loginPassword")
          .value;


      if (!email || !password) {

        showAuthMessage(
          "Please enter your email and password.",
          "error"
        );

        return;
      }


      showAuthMessage(
        "Logging in...",
        "success"
      );


      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        showAuthMessage(
          error.message,
          "error"
        );

        return;
      }


      currentUser = data.user;

      await startApp();

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      categories = [];

      clothes = [];

      savedLooks = [];

      currentUser = null;

      showAuth();

    }


    /* =====================================================
       START APP
       ===================================================== */

    async function startApp() {

      document
        .getElementById("authScreen")
        .classList.add("hidden");

      document
        .getElementById("appScreen")
        .classList.remove("hidden");

        .getElementById("userEmail")
        .textContent =

    /* =====================================================
       LOAD DATA
       ===================================================== */

    async function loadAllData() {

      showLoading();


      const categoryResult =
        await supabaseClient
          .from("categories")
          .select("*")
          .order("created_at", {
            ascending: true
          });


      if (categoryResult.error) {

        alert(
          "Could not load categories: " +
          categoryResult.error.message
        );

        return;
      }


      categories =
        categoryResult.data || [];


      const clothingResult =
        await supabaseClient
          .from("clothing_items")
          .select("*")
          .order("created_at", {
            ascending: true
          });


      if (clothingResult.error) {

        alert(
          "Could not load clothes: " +
          clothingResult.error.message
        );

        return;
      }


      clothes =
        clothingResult.data || [];


      const looksResult =
        await supabaseClient
          .from("saved_looks")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (looksResult.error) {

        alert(
          "Could not load looks: " +
          looksResult.error.message
        );

        return;
      }


      savedLooks =
        looksResult.data || [];


      renderCategories();

      renderLooks();

    }

    async function deleteCurrentCategory() {

      if (!editingCategoryId) return;


      const category =
        categories.find(
          item => item.id === editingCategoryId
        );


      if (!category) return;


      const count =
        clothes.filter(
          item =>
            item.category_id === editingCategoryId
        ).length;


      const confirmed =
        confirm(
          `Delete "${category.name}"?\n\n` +
          `This category contains ${count} ` +
          `${count === 1 ? "item" : "items"}.\n\n` +
          `All clothes inside this category will also be deleted.`
        );


      if (!confirmed) return;


      /*
       * Remove photos belonging to this category.
       */

      const categoryClothes =
        clothes.filter(
          item =>
            item.category_id === editingCategoryId
        );


      for (const item of categoryClothes) {

        if (item.photo_url) {

          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .remove([item.photo_url]);

        }

      }


      const {
        error
      } = await supabaseClient
        .from("categories")
        .delete()
        .eq("id", editingCategoryId);


      if (error) {

        alert(error.message);

        return;
      }


      closeCategoryModal();

      currentCategory = null;

      await loadAllData();

    }


    function confirmDeleteCategory(id) {

      const category =
        categories.find(
          item => item.id === id
        );


      if (!category) return;


      const count =
        clothes.filter(
          item =>
            item.category_id === id
        ).length;


      const confirmed =
        confirm(
          `Delete "${category.name}"?\n\n` +
          `It contains ${count} ` +
          `${count === 1 ? "item" : "items"}.\n\n` +
          `All clothes in this category will be deleted.`
        );


      if (!confirmed) return;


      editingCategoryId = id;

      deleteCurrentCategory();

    }

          escapeHtml(item.brand)

        >

          <div id="photo-${item.id}">
            <div class="no-photo">👕</div>

    async function loadPhotoUrls(items) {

      for (const item of items) {

        if (!item.photo_url)
          continue;


        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .createSignedUrl(
              item.photo_url,
              3600
            );


        if (
          error ||
          !data ||
          !data.signedUrl
        ) {
          continue;
        }


        const container =
          document.getElementById(
            "photo-" + item.id
          );


        if (!container)
          continue;


        container.innerHTML = `

          <img
            class="clothing-photo"
            src="${data.signedUrl}"
            alt="${escapeHtml(item.name)}"
          >

        `;

      }

    }

    async function saveClothing() {

      const name =
        document
          .getElementById("clothingName")
          .value
          .trim();


      const color =
        document
          .getElementById("clothingColor")
          .value
          .trim();


      const brand =
        document
          .getElementById("clothingBrand")
          .value
          .trim();


      const file =
        document
          .getElementById("clothingPhoto")
          .files[0];


      if (!name) {

        alert("Please enter a clothing name.");

        return;
      }


      const button =
        document.getElementById(
          "saveClothingButton"
        );


      button.disabled = true;

      button.textContent =
        "Saving...";


      let photoPath = null;


      /*
       * Upload photo to private Supabase Storage.
       */

      if (file) {

        const extension =
          file.name
            .split(".")
            .pop()
            .toLowerCase();


        const filename =
          crypto.randomUUID() +
          "." +
          extension;


        photoPath =
          currentUser.id +
          "/" +
          filename;


        const {
          error
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .upload(
              photoPath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (error) {

          alert(
            "Photo upload failed: " +
            error.message
          );

          button.disabled = false;

          button.textContent =
            "Add Clothing";

          return;
        }

      }


      /*
       * Save clothing record.
       */

      const {
        error
      } =
        await supabaseClient
          .from("clothing_items")
          .insert({

            user_id:
              currentUser.id,

            category_id:
              currentCategory.id,

            name: name,

            color: color || null,

            brand: brand || null,

            photo_url:
              photoPath

          });


      if (error) {

        if (photoPath) {

          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .remove([photoPath]);

        }


        alert(error.message);

        button.disabled = false;

        button.textContent =
          "Add Clothing";

        return;
      }


      button.disabled = false;

      button.textContent =
        "Add Clothing";


      closeClothingModal();

      await loadAllData();

      openCategory(currentCategory.id);

    }


    async function deleteClothing(id) {

      const item =
        clothes.find(
          clothing =>
            clothing.id === id
        );


      if (!item) return;


      const confirmed =
        confirm(
          `Delete "${item.name}"?`
        );


      if (!confirmed)
        return;


      /*
       * Delete private photo.
       */

      if (item.photo_url) {

        await supabaseClient
          .storage
          .from("wardrobe-photos")
          .remove([item.photo_url]);

      }


      /*
       * Delete database record.
       */

      const {
        error
      } =
        await supabaseClient
          .from("clothing_items")
          .delete()
          .eq("id", id);


      if (error) {

        alert(error.message);

        return;
      }


      await loadAllData();

      if (currentCategory) {

        openCategory(
          currentCategory.id
        );

      }

    }


    /* =====================================================
       SEARCH
       ===================================================== */

    function searchClothes() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();


      if (!search) {

        document
          .getElementById("searchPage")
          .classList.add("hidden");

        document
          .getElementById("homePage")
          .classList.remove("hidden");

        return;
      }


      document
        .getElementById("homePage")
        .classList.add("hidden");

      document
        .getElementById("categoryPage")
        .classList.add("hidden");

      document
        .getElementById("looksPage")
        .classList.add("hidden");

      document
        .getElementById("searchPage")
        .classList.remove("hidden");


      const results =
        clothes.filter(item => {

          const category =
            categories.find(
              c =>
                c.id === item.category_id
            );


          const text = [

            item.name,

            item.color,

            item.brand,

            category
              ? category.name
              : ""

          ]
            .join(" ")
            .toLowerCase();


          return text.includes(search);

        });


      const container =
        document.getElementById(
          "searchResults"
        );


      if (!results.length) {

        container.innerHTML = `

          <div
            class="empty"
            style="grid-column:1/-1;"
          >
            No clothes found.
          </div>

        `;

        return;
      }


      container.innerHTML =
        results
          .map(item =>
            clothingCard(item)
          )
          .join("");


      loadPhotoUrls(results);

    }


    /* =====================================================
       SAVED LOOKS
       ===================================================== */

    async function createLook() {

      if (clothes.length === 0) {

        alert(
          "Add some clothes first before creating a look."
        );

        return;
      }


      /*
       * Try to choose one item from
       * different categories.
       */

      const shuffled =
        [...clothes]
          .sort(
            () => Math.random() - 0.5
          );


      const selected = [];

      const usedCategories =
        new Set();


      for (const item of shuffled) {

        if (
          !usedCategories.has(
            item.category_id
          )
        ) {

          selected.push(item);

          usedCategories.add(
            item.category_id
          );

        }


        if (selected.length >= 3)
          break;

      }


      /*
       * If there aren't enough categories,
       * fill with random clothes.
       */

      if (selected.length < 3) {

        for (const item of shuffled) {

          if (
            !selected.some(
              x => x.id === item.id
            )
          ) {

            selected.push(item);

          }


          if (selected.length >= 3)
            break;

        }

      }


      currentLookItems =
        selected;


      const preview =
        document.getElementById(
          "lookPreview"
        );


      preview.innerHTML =
        selected
          .map(
            item => `

              <div class="look-item">

                <div
                  id="look-photo-${item.id}"
                  style="
                    width:100%;
                    aspect-ratio:1;
                    border-radius:10px;
                    background:#eee;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                  "
                >
                  👕
                </div>

                <div class="look-item-name">
                  ${escapeHtml(item.name)}
                </div>

              </div>

            `
          )
          .join("");


      document
        .getElementById("lookName")
        .value = "";


      document
        .getElementById("lookModal")
        .classList.remove("hidden");


      /*
       * Load signed private image URLs.
       */

      for (const item of selected) {

        if (!item.photo_url)
          continue;


        const {
          data
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .createSignedUrl(
              item.photo_url,
              3600
            );


        if (
          !data ||
          !data.signedUrl
        )
          continue;


        const box =
          document.getElementById(
            "look-photo-" + item.id
          );


        if (box) {

          box.innerHTML = `

            <img
              src="${data.signedUrl}"
              style="
                width:100%;
                height:100%;
                object-fit:cover;
                border-radius:10px;
              "
            >

          `;

        }

      }

    }


    function closeLookModal() {

      document
        .getElementById("lookModal")
        .classList.add("hidden");

    }


    async function saveLook() {

      const name =
        document
          .getElementById("lookName")
          .value
          .trim() ||
        "My Look";


      if (!currentLookItems.length)
        return;


      /*
       * Create saved look.
       */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("saved_looks")
          .insert({

            user_id:
              currentUser.id,

            name: name

          })
          .select()
          .single();


      if (error) {

        alert(error.message);

        return;
      }


      /*
       * Add clothing items to look.
       */

      const rows =
        currentLookItems.map(
          item => ({

            look_id:
              data.id,

            clothing_item_id:
              item.id

          })
        );


      const {
        error: itemError
      } =
        await supabaseClient
          .from("look_items")
          .insert(rows);


      if (itemError) {

        alert(itemError.message);

        return;
      }


      closeLookModal();

      await loadAllData();

      showPage("looks");

    }


    async function renderLooks() {

      const container =
        document.getElementById(
          "looksContainer"
        );


      if (!savedLooks.length) {

        container.innerHTML = `

          <div class="empty">

            <div style="font-size:45px;">
              ✨
            </div>

            <h3>No saved looks yet</h3>

            <p>
              Create a look from your wardrobe
              and save it here.
            </p>

            <button
              class="primary-btn"
              onclick="createLook()"
            >
              ✨ Create Look
            </button>

          </div>

        `;

        return;
      }


      container.innerHTML = "";


      /*
       * Load all look items in one query.
       */

      const {
        data: lookItems,
        error
      } =
        await supabaseClient
          .from("look_items")
          .select("*");


      if (error) {

        container.innerHTML =
          `<div class="empty">
            Could not load looks.
          </div>`;

        return;
      }


      for (const look of savedLooks) {

        const items =
          (lookItems || [])
            .filter(
              item =>
                item.look_id === look.id
            )
            .map(
              link =>
                clothes.find(
                  clothing =>
                    clothing.id ===
                    link.clothing_item_id
                )
            )
            .filter(Boolean);


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "look-card";


        card.innerHTML = `

          <div class="look-title">
            ${escapeHtml(look.name)}
          </div>

          <div class="look-items">

            ${
              items.length
                ? items
                    .map(
                      item => `

                        <div
                          class="look-item"
                          id="saved-look-${look.id}-${item.id}"
                        >

                          <div
                            style="
                              width:100%;
                              aspect-ratio:1;
                              background:#eee;
                              border-radius:10px;
                              display:flex;
                              align-items:center;
                              justify-content:center;
                            "
                          >
                            👕
                          </div>

                          <div class="look-item-name">
                            ${escapeHtml(item.name)}
                          </div>

                        </div>

                      `
                    )
                    .join("")
                : `
                    <div
                      style="
                        color:#888;
                        grid-column:1/-1;
                      "
                    >
                      No items
                    </div>
                  `
            }

          </div>

          <button
            class="delete-clothing"
            onclick="deleteLook('${look.id}')"
          >
            🗑️ Delete Look
          </button>

        `;


        container.appendChild(card);


        /*
         * Load private signed photos.
         */

        for (const item of items) {

          if (!item.photo_url)
            continue;


          const {
            data
          } =
            await supabaseClient
              .storage
              .from("wardrobe-photos")
              .createSignedUrl(
                item.photo_url,
                3600
              );


          if (
            !data ||
            !data.signedUrl
          )
            continue;


          const box =
            document.getElementById(
              `saved-look-${look.id}-${item.id}`
            );


          if (box) {

            const imageBox =
              box.querySelector(
                "div"
              );


            imageBox.innerHTML = `

              <img
                src="${data.signedUrl}"
                style="
                  width:100%;
                  height:100%;
                  object-fit:cover;
                  border-radius:10px;
                "
              >

            `;

          }

        }

      }

    }


    async function deleteLook(id) {

      const look =
        savedLooks.find(
          item =>
            item.id === id
        );


      if (!look) return;


      const confirmed =
        confirm(
          `Delete "${look.name}"?`
        );


      if (!confirmed)
        return;


      const {
        error
      } =
        await supabaseClient
          .from("saved_looks")
          .delete()
          .eq("id", id);


      if (error) {

        alert(error.message);

        return;
      }


      await loadAllData();

      renderLooks();

    }


    /* =====================================================
       SECURITY / HTML ESCAPING
       ===================================================== */

    function escapeHtml(value) {

      if (value === null ||
          value === undefined) {

        return "";

      }


      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =====================================================
       CLOSE MODALS WHEN CLICKING BACKGROUND
       ===================================================== */

    document
      .getElementById("categoryModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeCategoryModal();

          }

        }
      );


    document
      .getElementById("clothingModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeClothingModal();

          }

        }
      );


    document
      .getElementById("lookModal")
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target === this
          ) {

            closeLookModal();

          }

        }
      );


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if (
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )
            .catch(
              error =>
                console.log(
                  "Service worker registration failed:",
                  error
                )
            );

        }
      );

    }


    /* =====================================================
       START
       ===================================================== */

    checkSession();

  </script>

</body>
</html>
