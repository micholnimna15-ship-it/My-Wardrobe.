<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Wardrobe</title>

  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-180.png" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding-bottom: 80px;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
    }

    /* HEADER */

    header {
      background: #111;
      color: white;
      padding: 22px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    .header-subtitle {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 4px;
    }

    /* MAIN */

    main {
      padding: 20px;
    }

    .page-title {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .page-description {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    /* SEARCH */

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    .search-box input:focus {
      border-color: #111;
    }

    /* BUTTONS */

    .primary-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .secondary-btn {
      border: 1px solid #ddd;
      background: white;
      color: #111;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    .danger-btn {
      border: none;
      background: #d32f2f;
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* CATEGORY GRID */

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .category-card {
      border: 1px solid #e2e2e2;
      border-radius: 16px;
      padding: 18px;
      background: white;
      min-height: 150px;
      position: relative;
      transition: 0.2s;
    }

    .category-card:hover {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .category-main {
      cursor: pointer;
    }

    .category-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .category-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .category-count {
      font-size: 13px;
      color: #777;
    }

    .category-actions {
      position: absolute;
      right: 10px;
      bottom: 10px;
      display: flex;
      gap: 6px;
    }

    .small-action {
      width: 34px;
      height: 34px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      font-size: 15px;
    }

    .small-action.delete {
      color: #d32f2f;
    }

    /* BACK BUTTON */

    .back-btn {
      border: none;
      background: none;
      padding: 0;
      margin-bottom: 18px;
      font-size: 15px;
      font-weight: bold;
    }

    /* CLOTHES */

    .item-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .item-card {
      border: 1px solid #e3e3e3;
      border-radius: 15px;
      overflow: hidden;
      background: white;
    }

    .item-photo {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f0f0f0;
    }

    .item-placeholder {
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f1f1;
      font-size: 55px;
    }

    .item-info {
      padding: 13px;
    }

    .item-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .item-detail {
      color: #777;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .delete-item-btn {
      margin-top: 10px;
      border: none;
      background: #fff0f0;
      color: #d32f2f;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }

    .empty-icon {
      font-size: 50px;
      margin-bottom: 12px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 18px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-bottom: 18px;
      font-size: 21px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #111;
    }

    .icon-options {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
    }

    .icon-option {
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      padding: 9px;
      font-size: 22px;
    }

    .icon-option.selected {
      border: 2px solid #111;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    /* PHOTO PREVIEW */

    .photo-preview {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    /* LOOKS */

    .look-card {
      border: 1px solid #ddd;
      border-radius: 15px;
      padding: 14px;
      margin-bottom: 15px;
    }

    .look-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .look-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .look-item img,
    .look-item-placeholder {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .look-item-placeholder {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }

    .look-item-name {
      font-size: 11px;
      margin-top: 5px;
    }

    .delete-look {
      margin-top: 12px;
      border: none;
      background: #fff0f0;
      color: #d32f2f;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: center;
      z-index: 900;
    }

    .nav-inner {
      width: 100%;
      max-width: 900px;
      display: flex;
    }

    .nav-btn {
      flex: 1;
      border: none;
      background: white;
      font-size: 12px;
      color: #777;
    }

    .nav-btn.active {
      color: #111;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 22px;
      display: block;
      margin-bottom: 2px;
    }

    /* TOAST */

    .toast {
      position: fixed;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      z-index: 2000;
    }

    .toast.show {
      display: block;
    }

    /* RESPONSIVE */

    @media (min-width: 650px) {
      .category-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .item-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 480px) {
      main {
        padding: 16px;
      }

      .item-photo,
      .item-placeholder {
        height: 160px;
      }

      .category-card {
        min-height: 140px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div>
      <h1>My Wardrobe</h1>
      <div class="header-subtitle">Your personal style collection</div>
    </div>
  </header>

  <main id="appContent"></main>

</div>

<!-- BOTTOM NAV -->

<div class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-btn active" id="navWardrobe" onclick="showWardrobe()">
      <span class="nav-icon">👕</span>
      Wardrobe
    </button>

    <button class="nav-btn" id="navLooks" onclick="showLooks()">
      <span class="nav-icon">✨</span>
      Looks
    </button>

  </div>
</div>

<!-- CATEGORY MODAL -->

<div class="modal-overlay" id="categoryModal">

  <div class="modal">

    <h2 id="categoryModalTitle">Add Category</h2>

    <div class="form-group">
      <label>Category name</label>
      <input
        type="text"
        id="categoryNameInput"
        placeholder="e.g. Shirts"
      />
    </div>

    <div class="form-group">

      <label>Choose an icon</label>

      <div class="icon-options" id="iconOptions">

        <button class="icon-option" onclick="selectIcon('👕', this)">👕</button>
        <button class="icon-option" onclick="selectIcon('👖', this)">👖</button>
        <button class="icon-option" onclick="selectIcon('👗', this)">👗</button>
        <button class="icon-option" onclick="selectIcon('🧥', this)">🧥</button>
        <button class="icon-option" onclick="selectIcon('👚', this)">👚</button>
        <button class="icon-option" onclick="selectIcon('👔', this)">👔</button>
        <button class="icon-option" onclick="selectIcon('👟', this)">👟</button>
        <button class="icon-option" onclick="selectIcon('👞', this)">👞</button>
        <button class="icon-option" onclick="selectIcon('🩴', this)">🩴</button>
        <button class="icon-option" onclick="selectIcon('👜', this)">👜</button>
        <button class="icon-option" onclick="selectIcon('🎩', this)">🎩</button>
        <button class="icon-option" onclick="selectIcon('🧢', this)">🧢</button>

      </div>

    </div>

    <div class="modal-buttons">

      <button
        class="secondary-btn"
        onclick="closeCategoryModal()"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        style="margin:0"
        onclick="saveCategory()"
      >
        Save
      </button>

    </div>

  </div>

</div>


<!-- CLOTHING MODAL -->

<div class="modal-overlay" id="itemModal">

  <div class="modal">

    <h2>Add Clothing Item</h2>

    <div class="form-group">
      <label>Name</label>
      <input
        type="text"
        id="itemNameInput"
        placeholder="e.g. White Oxford Shirt"
      />
    </div>

    <div class="form-group">
      <label>Colour</label>
      <input
        type="text"
        id="itemColorInput"
        placeholder="e.g. White"
      />
    </div>

    <div class="form-group">
      <label>Brand (optional)</label>
      <input
        type="text"
        id="itemBrandInput"
        placeholder="e.g. Nike"
      />
    </div>

    <div class="form-group">

      <label>Photo</label>

      <input
        type="file"
        id="itemPhotoInput"
        accept="image/*"
        onchange="previewPhoto(event)"
      />

      <img
        id="photoPreview"
        class="photo-preview"
      />

    </div>

    <div class="modal-buttons">

      <button
        class="secondary-btn"
        onclick="closeItemModal()"
      >
        Cancel
      </button>

      <button
        class="primary-btn"
        style="margin:0"
        onclick="saveItem()"
      >
        Add Item
      </button>

    </div>

  </div>

</div>


<!-- DELETE CATEGORY MODAL -->

<div class="modal-overlay" id="deleteCategoryModal">

  <div class="modal">

    <h2>Delete Category?</h2>

    <p id="deleteCategoryMessage" style="line-height:1.5;color:#555;"></p>

    <div class="modal-buttons">

      <button
        class="secondary-btn"
        onclick="closeDeleteCategoryModal()"
      >
        Cancel
      </button>

      <button
        class="danger-btn"
        onclick="confirmDeleteCategory()"
      >
        Delete
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

  /* =========================
     STORAGE
  ========================= */

  const CATEGORY_KEY = "myWardrobeCategories";
  const ITEM_KEY = "myWardrobeItems";
  const LOOK_KEY = "myWardrobeLooks";


  let categories =
    JSON.parse(localStorage.getItem(CATEGORY_KEY)) || [];

  let items =
    JSON.parse(localStorage.getItem(ITEM_KEY)) || [];

  let looks =
    JSON.parse(localStorage.getItem(LOOK_KEY)) || [];


  let currentCategoryId = null;

  let editingCategoryId = null;

  let categoryToDelete = null;

  let selectedIcon = "👕";

  let currentPhoto = "";


  /* =========================
     SAVE DATA
  ========================= */

  function saveData() {

    localStorage.setItem(
      CATEGORY_KEY,
      JSON.stringify(categories)
    );

    localStorage.setItem(
      ITEM_KEY,
      JSON.stringify(items)
    );

    localStorage.setItem(
      LOOK_KEY,
      JSON.stringify(looks)
    );
  }


  /* =========================
     INITIAL LOAD
  ========================= */

  renderCategories();


  /* =========================
     WARDROBE
  ========================= */

  function showWardrobe() {

    currentCategoryId = null;

    document
      .getElementById("navWardrobe")
      .classList.add("active");

    document
      .getElementById("navLooks")
      .classList.remove("active");

    renderCategories();
  }


  function renderCategories() {

    const content =
      document.getElementById("appContent");

    content.innerHTML = `

      <h2 class="page-title">My Wardrobe</h2>

      <p class="page-description">
        Create your own categories and organise your clothes.
      </p>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Search your wardrobe..."
          oninput="searchWardrobe(this.value)"
        />
      </div>

      <button
        class="primary-btn"
        onclick="openAddCategoryModal()"
      >
        + Add Category
      </button>

      <div id="categoryArea"></div>
    `;

    renderCategoryArea();
  }


  function renderCategoryArea() {

    const area =
      document.getElementById("categoryArea");

    if (!area) return;


    if (categories.length === 0) {

      area.innerHTML = `

        <div class="empty">

          <div class="empty-icon">👗</div>

          <h3>No categories yet</h3>

          <p style="margin-top:8px;">
            Create your first category to start building your wardrobe.
          </p>

        </div>

      `;

      return;
    }


    let html = `<div class="category-grid">`;


    categories.forEach(category => {

      const count =
        items.filter(
          item => item.categoryId === category.id
        ).length;


      html += `

        <div class="category-card">

          <div
            class="category-main"
            onclick="openCategory('${category.id}')"
          >

            <div class="category-icon">
              ${category.icon || "👕"}
            </div>

            <div class="category-name">
              ${escapeHTML(category.name)}
            </div>

            <div class="category-count">
              ${count} ${count === 1 ? "item" : "items"}
            </div>

          </div>


          <div class="category-actions">

            <button
              class="small-action"
              title="Edit category"
              onclick="event.stopPropagation(); openEditCategoryModal('${category.id}')"
            >
              ✏️
            </button>

            <button
              class="small-action delete"
              title="Delete category"
              onclick="event.stopPropagation(); openDeleteCategoryModal('${category.id}')"
            >
              🗑️
            </button>

          </div>

        </div>

      `;

    });


    html += `</div>`;

    area.innerHTML = html;
  }


  /* =========================
     OPEN CATEGORY
  ========================= */

  function openCategory(categoryId) {

    currentCategoryId = categoryId;

    const category =
      categories.find(
        c => c.id === categoryId
      );

    if (!category) return;


    const categoryItems =
      items.filter(
        item => item.categoryId === categoryId
      );


    const content =
      document.getElementById("appContent");


    content.innerHTML = `

      <button
        class="back-btn"
        onclick="showWardrobe()"
      >
        ← Back to My Wardrobe
      </button>

      <h2 class="page-title">
        ${category.icon || "👕"}
        ${escapeHTML(category.name)}
      </h2>

      <p class="page-description">
        ${categoryItems.length}
        ${categoryItems.length === 1 ? "item" : "items"}
      </p>

      <button
        class="primary-btn"
        onclick="openItemModal()"
      >
        + Add Clothing
      </button>

      <div id="itemArea"></div>

    `;


    renderItems(categoryItems);
  }


  /* =========================
     ITEMS
  ========================= */

  function renderItems(categoryItems) {

    const area =
      document.getElementById("itemArea");

    if (!area) return;


    if (categoryItems.length === 0) {

      area.innerHTML = `

        <div class="empty">

          <div class="empty-icon">👕</div>

          <h3>No clothes yet</h3>

          <p style="margin-top:8px;">
            Add your first item to this category.
          </p>

        </div>

      `;

      return;
    }


    let html = `<div class="item-grid">`;


    categoryItems.forEach(item => {

      html += `

        <div class="item-card">

          ${
            item.photo

              ? `<img
                   class="item-photo"
                   src="${item.photo}"
                   alt="${escapeHTML(item.name)}"
                 >`

              : `<div class="item-placeholder">
                   👕
                 </div>`
          }

          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            ${
              item.color
                ? `<div class="item-detail">
                     🎨 ${escapeHTML(item.color)}
                   </div>`
                : ""
            }

            ${
              item.brand
                ? `<div class="item-detail">
                     🏷️ ${escapeHTML(item.brand)}
                   </div>`
                : ""
            }

            <button
              class="delete-item-btn"
              onclick="deleteItem('${item.id}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    });


    html += `</div>`;

    area.innerHTML = html;
  }


  /* =========================
     CATEGORY MODAL
  ========================= */

  function openAddCategoryModal() {

    editingCategoryId = null;

    document
      .getElementById("categoryModalTitle")
      .textContent = "Add Category";

    document
      .getElementById("categoryNameInput")
      .value = "";

    selectedIcon = "👕";

    updateSelectedIcon();

    document
      .getElementById("categoryModal")
      .classList.add("active");
  }


  function openEditCategoryModal(categoryId) {

    const category =
      categories.find(
        c => c.id === categoryId
      );

    if (!category) return;


    editingCategoryId = categoryId;

    document
      .getElementById("categoryModalTitle")
      .textContent = "Edit Category";


    document
      .getElementById("categoryNameInput")
      .value = category.name;


    selectedIcon =
      category.icon || "👕";


    updateSelectedIcon();


    document
      .getElementById("categoryModal")
      .classList.add("active");
  }


  function closeCategoryModal() {

    document
      .getElementById("categoryModal")
      .classList.remove("active");

    editingCategoryId = null;
  }


  function selectIcon(icon, button) {

    selectedIcon = icon;

    updateSelectedIcon();
  }


  function updateSelectedIcon() {

    const buttons =
      document.querySelectorAll(
        ".icon-option"
      );


    buttons.forEach(button => {

      if (
        button.textContent.trim() ===
        selectedIcon
      ) {

        button.classList.add("selected");

      } else {

        button.classList.remove("selected");

      }

    });

  }


  /* =========================
     SAVE CATEGORY
  ========================= */

  function saveCategory() {

    const name =
      document
        .getElementById("categoryNameInput")
        .value
        .trim();


    if (!name) {

      showToast(
        "Please enter a category name."
      );

      return;
    }


    /* EDIT EXISTING CATEGORY */

    if (editingCategoryId) {

      const category =
        categories.find(
          c => c.id === editingCategoryId
        );


      if (category) {

        category.name = name;

        category.icon = selectedIcon;

      }


      saveData();

      closeCategoryModal();

      renderCategories();

      showToast(
        "Category updated successfully."
      );

      return;
    }


    /* ADD NEW CATEGORY */

    const alreadyExists =
      categories.some(
        category =>
          category.name.toLowerCase() ===
          name.toLowerCase()
      );


    if (alreadyExists) {

      showToast(
        "A category with that name already exists."
      );

      return;
    }


    const newCategory = {

      id:
        Date.now().toString(),

      name: name,

      icon: selectedIcon

    };


    categories.push(newCategory);

    saveData();

    closeCategoryModal();

    renderCategories();

    showToast(
      "Category added successfully."
    );
  }


  /* =========================
     DELETE CATEGORY
  ========================= */

  function openDeleteCategoryModal(categoryId) {

    const category =
      categories.find(
        c => c.id === categoryId
      );

    if (!category) return;


    categoryToDelete = categoryId;


    const itemCount =
      items.filter(
        item =>
          item.categoryId === categoryId
      ).length;


    let message = `

      Are you sure you want to delete

      <strong>
        ${escapeHTML(category.icon || "")}
        ${escapeHTML(category.name)}
      </strong>?

    `;


    if (itemCount > 0) {

      message += `

        <br><br>

        This category contains
        <strong>${itemCount}</strong>
        ${itemCount === 1 ? "clothing item" : "clothing items"}.

        <br>

        Deleting the category will also
        delete these clothing items.

      `;

    } else {

      message += `

        <br><br>

        This category is empty.

      `;

    }


    document
      .getElementById("deleteCategoryMessage")
      .innerHTML = message;


    document
      .getElementById("deleteCategoryModal")
      .classList.add("active");
  }


  function closeDeleteCategoryModal() {

    document
      .getElementById("deleteCategoryModal")
      .classList.remove("active");

    categoryToDelete = null;
  }


  function confirmDeleteCategory() {

    if (!categoryToDelete) return;


    const category =
      categories.find(
        c => c.id === categoryToDelete
      );


    /* DELETE CATEGORY */

    categories =
      categories.filter(
        c => c.id !== categoryToDelete
      );


    /* DELETE ALL CLOTHES IN CATEGORY */

    items =
      items.filter(
        item =>
          item.categoryId !== categoryToDelete
      );


    saveData();


    closeDeleteCategoryModal();


    currentCategoryId = null;


    renderCategories();


    showToast(
      `"${category ? category.name : "Category"}" deleted.`
    );

  }


  /* =========================
     ITEM MODAL
  ========================= */

  function openItemModal() {

    document
      .getElementById("itemNameInput")
      .value = "";

    document
      .getElementById("itemColorInput")
      .value = "";

    document
      .getElementById("itemBrandInput")
      .value = "";

    document
      .getElementById("itemPhotoInput")
      .value = "";

    document
      .getElementById("photoPreview")
      .style.display = "none";

    currentPhoto = "";


    document
      .getElementById("itemModal")
      .classList.add("active");
  }


  function closeItemModal() {

    document
      .getElementById("itemModal")
      .classList.remove("active");
  }


  /* =========================
     PHOTO
  ========================= */

  function previewPhoto(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    const reader =
      new FileReader();


    reader.onload = function(e) {

      currentPhoto =
        e.target.result;


      const preview =
        document.getElementById(
          "photoPreview"
        );


      preview.src =
        currentPhoto;

      preview.style.display =
        "block";

    };


    reader.readAsDataURL(file);
  }


  /* =========================
     SAVE ITEM
  ========================= */

  function saveItem() {

    if (!currentCategoryId) {

      showToast(
        "Please open a category first."
      );

      return;
    }


    const name =
      document
        .getElementById("itemNameInput")
        .value
        .trim();


    const color =
      document
        .getElementById("itemColorInput")
        .value
        .trim();


    const brand =
      document
        .getElementById("itemBrandInput")
        .value
        .trim();


    if (!name) {

      showToast(
        "Please enter the clothing name."
      );

      return;
    }


    const newItem = {

      id:
        Date.now().toString(),

      name: name,

      categoryId:
        currentCategoryId,

      color: color,

      brand: brand,

      photo: currentPhoto,

      emoji: "👕"

    };


    items.push(newItem);

    saveData();

    closeItemModal();

    openCategory(currentCategoryId);

    showToast(
      "Clothing item added."
    );
  }


  /* =========================
     DELETE ITEM
  ========================= */

  function deleteItem(itemId) {

    const item =
      items.find(
        i => i.id === itemId
      );

    if (!item) return;


    const confirmed =
      confirm(
        `Delete "${item.name}" from your wardrobe?`
      );


    if (!confirmed) return;


    items =
      items.filter(
        i => i.id !== itemId
      );


    saveData();


    if (currentCategoryId) {

      openCategory(
        currentCategoryId
      );

    }


    showToast(
      "Clothing item deleted."
    );
  }


  /* =========================
     SEARCH
  ========================= */

  function searchWardrobe(query) {

    query =
      query.trim().toLowerCase();


    const area =
      document.getElementById(
        "categoryArea"
      );


    if (!area) return;


    if (!query) {

      renderCategoryArea();

      return;
    }


    const results =
      items.filter(item => {

        return (

          item.name
            .toLowerCase()
            .includes(query)

          ||

          (item.color || "")
            .toLowerCase()
            .includes(query)

          ||

          (item.brand || "")
            .toLowerCase()
            .includes(query)

        );

      });


    if (results.length === 0) {

      area.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🔍
          </div>

          <h3>No items found</h3>

          <p style="margin-top:8px;">
            Try another search.
          </p>

        </div>

      `;

      return;
    }


    let html =
      `<div class="item-grid">`;


    results.forEach(item => {

      const category =
        categories.find(
          c =>
            c.id === item.categoryId
        );


      html += `

        <div class="item-card">

          ${
            item.photo

              ? `<img
                   class="item-photo"
                   src="${item.photo}"
                   alt="${escapeHTML(item.name)}"
                 >`

              : `<div class="item-placeholder">
                   👕
                 </div>`
          }

          <div class="item-info">

            <div class="item-name">
              ${escapeHTML(item.name)}
            </div>

            <div class="item-detail">
              📁
              ${
                category
                  ? escapeHTML(category.name)
                  : "Unknown"
              }
            </div>

            ${
              item.color
                ? `<div class="item-detail">
                     🎨 ${escapeHTML(item.color)}
                   </div>`
                : ""
            }

            ${
              item.brand
                ? `<div class="item-detail">
                     🏷️ ${escapeHTML(item.brand)}
                   </div>`
                : ""
            }

          </div>

        </div>

      `;

    });


    html += `</div>`;

    area.innerHTML = html;
  }


  /* =========================
     CREATE LOOK / SAVED LOOKS
  ========================= */

  function showLooks() {

    document
      .getElementById("navWardrobe")
      .classList.remove("active");

    document
      .getElementById("navLooks")
      .classList.add("active");


    const content =
      document.getElementById(
        "appContent"
      );


    content.innerHTML = `

      <h2 class="page-title">
        Create Look
      </h2>

      <p class="page-description">
        Select items from your wardrobe to create an outfit.
      </p>

      <button
        class="primary-btn"
        onclick="createRandomLook()"
      >
        ✨ Create Look
      </button>

      <h3 style="margin-bottom:15px;">
        Saved Looks
      </h3>

      <div id="looksArea"></div>

    `;


    renderLooks();
  }


  function createRandomLook() {

    if (items.length < 1) {

      showToast(
        "Add some clothes first."
      );

      return;
    }


    const shuffled =
      [...items].sort(
        () => Math.random() - 0.5
      );


    const selected =
      shuffled.slice(
        0,
        Math.min(3, shuffled.length)
      );


    looks.push({

      id:
        Date.now().toString(),

      createdAt:
        new Date().toISOString(),

      items:
        selected

    });


    saveData();

    renderLooks();


    showToast(
      "New look created."
    );
  }


  function renderLooks() {

    const area =
      document.getElementById(
        "looksArea"
      );

    if (!area) return;


    if (looks.length === 0) {

      area.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            ✨
          </div>

          <h3>No saved looks</h3>

          <p style="margin-top:8px;">
            Create your first look.
          </p>

        </div>

      `;

      return;
    }


    let html = "";


    [...looks]
      .reverse()
      .forEach((look, index) => {

        html += `

          <div class="look-card">

            <div class="look-title">
              Look ${looks.length - index}
            </div>

            <div class="look-items">

        `;


        look.items.forEach(item => {

          html += `

            <div class="look-item">

              ${
                item.photo

                  ? `<img
                       src="${item.photo}"
                       alt="${escapeHTML(item.name)}"
                     >`

                  : `<div class="look-item-placeholder">
                       👕
                     </div>`
              }

              <div class="look-item-name">
                ${escapeHTML(item.name)}
              </div>

            </div>

          `;

        });


        html += `

            </div>

            <button
              class="delete-look"
              onclick="deleteLook('${look.id}')"
            >
              🗑️ Delete Look
            </button>

          </div>

        `;

      });


    area.innerHTML = html;
  }


  function deleteLook(lookId) {

    const confirmed =
      confirm(
        "Delete this saved look?"
      );


    if (!confirmed) return;


    looks =
      looks.filter(
        look =>
          look.id !== lookId
      );


    saveData();

    renderLooks();

    showToast(
      "Look deleted."
    );
  }


  /* =========================
     UTILITIES
  ========================= */

  function showToast(message) {

    const toast =
      document.getElementById(
        "toast"
      );


    toast.textContent =
      message;


    toast.classList.add(
      "show"
    );


    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

  }


  function escapeHTML(value) {

    if (!value) return "";


    return String(value)
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* =========================
     CLOSE MODALS WHEN
     CLICKING OUTSIDE
  ========================= */

  document
    .getElementById("categoryModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeCategoryModal();

        }

      }
    );


  document
    .getElementById("itemModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeItemModal();

        }

      }
    );


  document
    .getElementById("deleteCategoryModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target === this
        ) {

          closeDeleteCategoryModal();

        }

      }
    );

</script>

</body>
