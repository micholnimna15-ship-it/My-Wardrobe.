<html lang="en">
<head>

  <meta name="theme-color" content="#faf9f7">

  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>My Wardrobe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf9f7;
      color: #171717;
    }

    header {
      padding: 22px 18px 10px;
      position: sticky;
      top: 0;
      background: rgba(250, 249, 247, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 5;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    h2 {
      margin: 0;
    }

    .search {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      font-size: 15px;
      outline: none;
    }

    .search:focus {
      border-color: #999;
    }

    nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      scrollbar-width: none;
    }

    nav::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: 0;
      background: #eee;
      padding: 9px 14px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      background: #171717;
      color: white;
    }

    main {
      padding: 8px 18px 110px;
    }

    .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
    }

    .count {
      color: #777;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .photo {
      height: 210px;
      background: #f0efed;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 11px;
    }

    .name {
      font-weight: 600;
    }

    .meta {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 80px;
      border: 0;
      background: #171717;
      color: white;
      border-radius: 30px;
      padding: 15px 20px;
      font-size: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      z-index: 9;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      padding: 10px 4px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    .bottom button {
      border: 0;
      background: none;
      padding: 6px 12px;
      color: #666;
      cursor: pointer;
      font-size: 13px;
    }

    .bottom .sel {
      color: #111;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
      align-items: flex-end;
    }

    .modal.open {
      display: flex;
    }

    .sheet {
      background: white;
      width: 100%;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .sheet h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin: 12px 0 5px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    .preview {
      height: 170px;
      border-radius: 14px;
      background: #f1f0ee;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 50px;
      margin-bottom: 4px;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
    }

    .primary {
      background: #171717 !important;
      color: white !important;
      border-color: #171717 !important;
    }

    .look {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .lookrow {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-top: 12px;
      scrollbar-width: none;
    }

    .lookrow::-webkit-scrollbar {
      display: none;
    }

    .mini {
      min-width: 120px;
      background: #f2f1ef;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 8px;
      cursor: pointer;
      text-align: left;
    }

    .mini.selected {
      border-color: #171717;
    }

    .mini .photo {
      height: 100px;
      background: transparent;
      font-size: 34px;
      border-radius: 8px;
    }

    .mini b {
      display: block;
      font-size: 13px;
      padding: 6px 2px 2px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #777;
    }

    .saved-item {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
    }

    .saved-items {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-top: 12px;
    }

    .saved-mini {
      min-width: 95px;
      text-align: center;
      font-size: 12px;
    }

    .saved-mini .photo {
      height: 90px;
      border-radius: 12px;
      font-size: 32px;
    }

    .delete-look {
      margin-top: 14px;
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (min-width: 700px) {
      main {
        max-width: 900px;
        margin: auto;
      }

      header {
        padding-left: max(18px, calc((100vw - 900px) / 2));
        padding-right: max(18px, calc((100vw - 900px) / 2));
      }

      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .bottom {
        max-width: 700px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: 100%;
        border-radius: 18px 18px 0 0;
      }
    }
  </style>

</head>

  </div>

  <script>

    /* =========================================
       MY WARDROBE
       Main application
       ========================================= */

    var ITEMS_KEY = "myWardrobeItems";
    var LOOKS_KEY = "myWardrobeLooks";

    var currentCategory = "All";
    var currentPage = "wardrobe";
    var previewData = "";

    var selected = {
      shirt: null,
      pants: null,
      shoes: null
    };

    var categories = [
      "All",
      "Shirts",
      "Pants",
      "Jackets",
      "Shoes",
      "Accessories",
      "Shorts",
      "Other"
    ];

    var defaultItems = [
      {
        id: "default-1",
        name: "White Shirt",
        category: "Shirts",
        color: "White",
        brand: "",
        emoji: "👕"
      },
      {
        id: "default-2",
        name: "Black Shirt",
        category: "Shirts",
        color: "Black",
        brand: "",
        emoji: "👕"
      },
      {
        id: "default-3",
        name: "Blue Shirt",
        category: "Shirts",
        color: "Blue",
        brand: "",
        emoji: "👕"
      },
      {
        id: "default-4",
        name: "Black Pants",
        category: "Pants",
        color: "Black",
        brand: "",
        emoji: "👖"
      },
      {
        id: "default-5",
        name: "Beige Chinos",
        category: "Pants",
        color: "Beige",
        brand: "",
        emoji: "👖"
      },
      {
        id: "default-6",
        name: "White Sneakers",
        category: "Shoes",
        color: "White",
        brand: "",
        emoji: "👟"
      }
    ];

    var items = loadData(ITEMS_KEY);
    var looks = loadData(LOOKS_KEY);

    if (!Array.isArray(items) || items.length === 0) {
      items = defaultItems.slice();
      saveData(ITEMS_KEY, items);
    }

    if (!Array.isArray(looks)) {
      looks = [];
    }


    /* =========================================
       DOM ELEMENTS
       ========================================= */

    var app = document.getElementById("app");
    var chips = document.getElementById("chips");
    var searchInput = document.getElementById("searchInput");

    var addButton = document.getElementById("addButton");

    var wardrobeBtn = document.getElementById("wardrobeBtn");
    var lookBtn = document.getElementById("lookBtn");
    var savedBtn = document.getElementById("savedBtn");

    var modal = document.getElementById("modal");

    var preview = document.getElementById("preview");
    var photoInput = document.getElementById("photoInput");

    var nameInput = document.getElementById("nameInput");
    var categoryInput = document.getElementById("categoryInput");
    var colorInput = document.getElementById("colorInput");
    var brandInput = document.getElementById("brandInput");

    var cancelButton = document.getElementById("cancelButton");
    var saveButton = document.getElementById("saveButton");


    /* =========================================
       LOCAL STORAGE
       ========================================= */

    function loadData(key) {
      try {
        var data = localStorage.getItem(key);

        if (!data) {
          return [];
        }

        return JSON.parse(data);

      } catch (error) {
        console.error("Could not load data:", error);
        return [];
      }
    }


    function saveData(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
        return true;

      } catch (error) {
        console.error("Could not save data:", error);

        alert(
          "Your browser could not save this item. " +
          "The photo may be too large. Try a smaller photo."
        );

        return false;
      }
    }


    /* =========================================
       ESCAPE HTML
       ========================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================================
       CATEGORY BUTTONS
       ========================================= */

    function renderChips() {

      var html = "";

      for (var i = 0; i < categories.length; i++) {

        var category = categories[i];

        html +=
          '<button type="button" class="chip ' +
          (category === currentCategory ? "active" : "") +
          '" data-category="' +
          escapeHTML(category) +
          '">' +
          escapeHTML(category) +
          "</button>";
      }

      chips.innerHTML = html;

      var chipButtons = chips.querySelectorAll(".chip");

      for (var j = 0; j < chipButtons.length; j++) {

        chipButtons[j].addEventListener("click", function () {

          currentCategory = this.getAttribute("data-category");

          showWardrobe();
        });
      }
    }


    /* =========================================
       PAGE NAVIGATION
       ========================================= */

    function updateBottomButtons() {

      wardrobeBtn.classList.remove("sel");
      lookBtn.classList.remove("sel");
      savedBtn.classList.remove("sel");

      if (currentPage === "wardrobe") {
        wardrobeBtn.classList.add("sel");
      }

      if (currentPage === "looks") {
        lookBtn.classList.add("sel");
      }

      if (currentPage === "saved") {
        savedBtn.classList.add("sel");
      }
    }


    function showWardrobe() {

      currentPage = "wardrobe";

      addButton.style.display = "block";

      updateBottomButtons();
      renderChips();
      render();
    }


    function showLooks() {

      currentPage = "looks";

      addButton.style.display = "none";

      updateBottomButtons();
      renderChips();
      render();
    }


    function showSaved() {

      currentPage = "saved";

      addButton.style.display = "none";

      updateBottomButtons();
      renderChips();
      render();
    }


    /* =========================================
       SEARCH
       ========================================= */

    searchInput.addEventListener("input", function () {
      render();
    });


    /* =========================================
       CREATE ITEM CARD
       ========================================= */

    function createCard(item) {

      var imageHTML = "";

      if (item.photo) {

        imageHTML =
          '<img src="' +
          item.photo +
          '" alt="' +
          escapeHTML(item.name) +
          '">';

      } else {

        imageHTML = escapeHTML(item.emoji || "👕");
      }

      return (
        '<div class="card">' +

          '<div class="photo">' +
            imageHTML +
          "</div>" +

          '<div class="info">' +

            '<div class="name">' +
              escapeHTML(item.name) +
            "</div>" +

            '<div class="meta">' +
              escapeHTML(item.category) +
              (item.color ? " · " + escapeHTML(item.color) : "") +
            "</div>" +

            (item.brand
              ? '<div class="meta">' +
                escapeHTML(item.brand) +
                "</div>"
              : "") +

          "</div>" +

        "</div>"
      );
    }


    /* =========================================
       RENDER MAIN PAGE
       ========================================= */

    function render() {

      if (currentPage === "wardrobe") {

        renderWardrobe();

      } else if (currentPage === "looks") {

        renderLooks();

      } else if (currentPage === "saved") {

        renderSavedLooks();
      }
    }


    /* =========================================
       WARDROBE
       ========================================= */

    function renderWardrobe() {

      var query = searchInput.value
        .trim()
        .toLowerCase();

      var filtered = [];

      for (var i = 0; i < items.length; i++) {

        var item = items[i];

        var matchesCategory =
          currentCategory === "All" ||
          item.category === currentCategory;

        var searchable =
          (
            (item.name || "") +
            " " +
            (item.category || "") +
            " " +
            (item.color || "") +
            " " +
            (item.brand || "")
          ).toLowerCase();

        var matchesSearch =
          searchable.indexOf(query) !== -1;

        if (matchesCategory && matchesSearch) {
          filtered.push(item);
        }
      }


      var heading =
        currentCategory === "All"
          ? "All Clothes"
          : currentCategory;


      var html =
        '<div class="title">' +

          "<h2>" +
            escapeHTML(heading) +
          "</h2>" +

          '<span class="count">' +
            filtered.length +
            " items" +
          "</span>" +

        "</div>";


      if (filtered.length > 0) {

        html += '<div class="grid">';

        for (var j = 0; j < filtered.length; j++) {
          html += createCard(filtered[j]);
        }

        html += "</div>";

      } else {

        html +=
          '<div class="empty">' +
            "No clothes found.<br><br>" +
            "Tap ＋ Add Clothes to add something new." +
          "</div>";
      }


      app.innerHTML = html;
    }


    /* =========================================
       CREATE LOOK
       ========================================= */

    function renderLooks() {

      var shirts = items.filter(function (item) {
        return item.category === "Shirts";
      });

      var pants = items.filter(function (item) {
        return item.category === "Pants";
      });

      var shoes = items.filter(function (item) {
        return item.category === "Shoes";
      });


      var html =
        '<div class="title">' +
          "<h2>Create a Look</h2>" +
        "</div>" +

        '<div class="look">' +
          "<b>1. Choose a shirt</b>" +
          '<div class="lookrow">' +
            createSelectionCards(shirts, "shirt") +
          "</div>" +
        "</div>" +

        '<div class="look">' +
          "<b>2. Choose pants</b>" +
          '<div class="lookrow">' +
            createSelectionCards(pants, "pants") +
          "</div>" +
        "</div>" +

        '<div class="look">' +
          "<b>3. Choose shoes</b>" +
          '<div class="lookrow">' +
            createSelectionCards(shoes, "shoes") +
          "</div>" +
        "</div>" +

        '<button id="saveLookButton" ' +
        'class="primary" ' +
        'type="button" ' +
        'style="width:100%;padding:14px;border-radius:12px;margin-top:16px;border:0;">' +
          "♥ Save This Look" +
        "</button>";


      app.innerHTML = html;


      var selectionButtons =
        app.querySelectorAll(".mini");


      for (var i = 0; i < selectionButtons.length; i++) {

        selectionButtons[i].addEventListener(
          "click",
          function () {

            var type =
              this.getAttribute("data-type");

            var itemId =
              this.getAttribute("data-id");

            choose(type, itemId);
          }
        );
      }


      var saveLookButton =
        document.getElementById("saveLookButton");

      saveLookButton.addEventListener(
        "click",
        saveLook
      );
    }


    function createSelectionCards(list, type) {

      if (list.length === 0) {

        return (
          '<div style="padding:15px;color:#777;">' +
            "No items available." +
          "</div>"
        );
      }


      var html = "";

      for (var i = 0; i < list.length; i++) {

        var item = list[i];

        var isSelected =
          selected[type] &&
          selected[type].id === item.id;


        var imageHTML = "";

        if (item.photo) {

          imageHTML =
            '<img src="' +
            item.photo +
            '" alt="' +
            escapeHTML(item.name) +
            '">';

        } else {

          imageHTML =
            escapeHTML(item.emoji || "👕");
        }


        html +=
          '<button type="button" ' +
          'class="mini ' +
          (isSelected ? "selected" : "") +
          '" ' +
          'data-type="' +
          escapeHTML(type) +
          '" ' +
          'data-id="' +
          escapeHTML(item.id) +
          '">' +

            '<div class="photo">' +
              imageHTML +
            "</div>" +

            "<b>" +
              escapeHTML(item.name) +
            "</b>" +

          "</button>";
      }

      return html;
    }


    function choose(type, itemId) {

      var found = null;

      for (var i = 0; i < items.length; i++) {

        if (String(items[i].id) === String(itemId)) {

          found = items[i];
          break;
        }
      }

      selected[type] = found;

      render();
    }


    /* =========================================
       SAVE LOOK
       ========================================= */

    function saveLook() {

      var chosen = [];

      if (selected.shirt) {
        chosen.push(selected.shirt);
      }

      if (selected.pants) {
        chosen.push(selected.pants);
      }

      if (selected.shoes) {
        chosen.push(selected.shoes);
      }


      if (chosen.length < 2) {

        alert(
          "Choose at least two items first."
        );

        return;
      }


      looks.unshift(chosen);

      if (!saveData(LOOKS_KEY, looks)) {
        return;
      }


      selected = {
        shirt: null,
        pants: null,
        shoes: null
      };


      showSaved();
    }


    /* =========================================
       SAVED LOOKS
       ========================================= */

    function renderSavedLooks() {

      var html =
        '<div class="title">' +

          "<h2>Saved Looks</h2>" +

          '<span class="count">' +
            looks.length +
          "</span>" +

        "</div>";


      if (looks.length === 0) {

        html +=
          '<div class="empty">' +
            "No saved looks yet.<br><br>" +
            "Create a look and save it here." +
          "</div>";

        app.innerHTML = html;

        return;
      }


      for (var i = 0; i < looks.length; i++) {

        var look = looks[i];

        html +=
          '<div class="saved-item">' +

            "<b>Look " +
              (i + 1) +
            "</b>" +

            '<div class="saved-items">';


        for (var j = 0; j < look.length; j++) {

          var item = look[j];

          var imageHTML = "";

          if (item.photo) {

            imageHTML =
              '<img src="' +
              item.photo +
              '" alt="' +
              escapeHTML(item.name) +
              '">';

          } else {

            imageHTML =
              escapeHTML(item.emoji || "👕");
          }


          html +=
            '<div class="saved-mini">' +

              '<div class="photo">' +
                imageHTML +
              "</div>" +

              "<div>" +
                escapeHTML(item.name) +
              "</div>" +

            "</div>";
        }


        html +=
            "</div>" +

            '<button ' +
            'type="button" ' +
            'class="delete-look" ' +
            'data-index="' +
            i +
            '">' +
              "Delete Look" +
            "</button>" +

          "</div>";
      }


      app.innerHTML = html;


      var deleteButtons =
        app.querySelectorAll(".delete-look");


      for (var k = 0; k < deleteButtons.length; k++) {

        deleteButtons[k].addEventListener(
          "click",
          function () {

            var index =
              parseInt(
                this.getAttribute("data-index"),
                10
              );

            deleteLook(index);
          }
        );
      }
    }


    function deleteLook(index) {

      if (!confirm("Delete this saved look?")) {
        return;
      }

      looks.splice(index, 1);

      saveData(LOOKS_KEY, looks);

      renderSavedLooks();
    }


    /* =========================================
       ADD CLOTHES MODAL
       ========================================= */

    function openAdd() {

      modal.classList.add("open");

      setTimeout(function () {
        nameInput.focus();
      }, 100);
    }


    function closeAdd() {

      modal.classList.remove("open");

      previewData = "";

      photoInput.value = "";

      preview.innerHTML = "📷";

      nameInput.value = "";
      colorInput.value = "";
      brandInput.value = "";

      categoryInput.value = "Shirts";
    }


    addButton.addEventListener(
      "click",
      openAdd
    );


    cancelButton.addEventListener(
      "click",
      closeAdd
    );


    modal.addEventListener(
      "click",
      function (event) {

        if (event.target === modal) {
          closeAdd();
        }
      }
    );


    /* =========================================
       PHOTO PREVIEW
       ========================================= */

    photoInput.addEventListener(
      "change",
      function (event) {

        var file =
          event.target.files &&
          event.target.files[0];


        if (!file) {
          return;
        }


        if (!file.type.startsWith("image/")) {

          alert("Please choose an image.");

          photoInput.value = "";

          return;
        }


        var reader =
          new FileReader();


        reader.onload = function () {

          previewData =
            reader.result;

          preview.innerHTML =
            '<img src="' +
            previewData +
            '" alt="Preview">';
        };


        reader.onerror = function () {

          alert(
            "The photo could not be loaded."
          );
        };


        reader.readAsDataURL(file);
      }
    );


    /* =========================================
       CREATE EMOJI
       ========================================= */

    function getEmoji(category) {

      if (category === "Shoes") {
        return "👟";
      }

      if (
        category === "Pants" ||
        category === "Shorts"
      ) {
        return "👖";
      }

      if (category === "Accessories") {
        return "⌚";
      }

      if (category === "Jackets") {
        return "🧥";
      }

      return "👕";
    }


    /* =========================================
       SAVE NEW CLOTHING ITEM
       ========================================= */

    saveButton.addEventListener(
      "click",
      saveItem
    );


    function saveItem() {

      var itemName =
        nameInput.value.trim();


      if (!itemName) {

        alert(
          "Please enter an item name."
        );

        nameInput.focus();

        return;
      }


      var newItem = {

        id:
          "item-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2, 8),

        name: itemName,

        category:
          categoryInput.value,

        color:
          colorInput.value.trim(),

        brand:
          brandInput.value.trim(),

        emoji:
          getEmoji(categoryInput.value),

        photo:
          previewData || ""
      };


      items.unshift(newItem);


      if (!saveData(ITEMS_KEY, items)) {

        items.shift();

        return;
      }


      closeAdd();

      currentCategory = "All";

      showWardrobe();
    }


    /* =========================================
       NAVIGATION BUTTONS
       ========================================= */

    wardrobeBtn.addEventListener(
      "click",
      showWardrobe
    );

    lookBtn.addEventListener(
      "click",
      showLooks
    );

    savedBtn.addEventListener(
      "click",
      showSaved
    );


    /* =========================================
       KEYBOARD SUPPORT
       ========================================= */

    document.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Escape") {

          if (modal.classList.contains("open")) {
            closeAdd();
          }
        }
      }
    );


    /* =========================================
       START APPLICATION
       ========================================= */

    renderChips();
    showWardrobe();


    /* =========================================
       SERVICE WORKER
       ========================================= */

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        function () {

          navigator.serviceWorker
            .register("./service-worker.js")
            .then(function () {

              console.log(
                "My Wardrobe service worker registered."
              );

            })
            .catch(function (error) {

              console.log(
                "Service worker registration failed:",
                error
              );

            });
        }
      );
    }

  </script>

</body>
</html>
