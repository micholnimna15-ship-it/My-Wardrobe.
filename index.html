<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#faf9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Wardrobe">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">

<title>My Wardrobe</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#faf9f7;
  color:#171717;
}

header{
  padding:22px 18px 10px;
  position:sticky;
  top:0;
  background:rgba(250,249,247,.95);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  z-index:5;
}

h1{
  margin:0 0 15px;
  font-size:28px;
}

h2{
  margin:0;
}

.search{
  width:100%;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  background:white;
  font-size:15px;
  outline:none;
}

.search:focus{
  border-color:#999;
}

main{
  padding:10px 18px 110px;
  max-width:1000px;
  margin:auto;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:14px 0;
}

.count{
  color:#777;
  font-size:14px;
}

/* CATEGORY GRID */

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.category-card{
  background:white;
  border-radius:18px;
  padding:22px 16px;
  min-height:145px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
  cursor:pointer;
  border:0;
  text-align:left;
}

.category-icon{
  font-size:45px;
  margin-bottom:14px;
}

.category-name{
  font-size:17px;
  font-weight:600;
}

.category-count{
  margin-top:5px;
  color:#777;
  font-size:13px;
}

/* CLOTHING GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}

.photo{
  height:210px;
  background:#f0efed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:58px;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.info{
  padding:11px;
}

.name{
  font-weight:600;
}

.meta{
  font-size:13px;
  color:#777;
  margin-top:4px;
}

/* BUTTONS */

.button-row{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.action-button{
  flex:1;
  padding:13px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  cursor:pointer;
  font-size:14px;
}

.primary{
  background:#171717!important;
  color:white!important;
  border-color:#171717!important;
}

.fab{
  position:fixed;
  right:20px;
  bottom:80px;
  border:0;
  background:#171717;
  color:white;
  border-radius:30px;
  padding:15px 20px;
  font-size:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  cursor:pointer;
  z-index:9;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #eee;
  display:flex;
  justify-content:space-around;
  padding:10px 4px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  z-index:10;
}

.bottom button{
  border:0;
  background:none;
  padding:6px 12px;
  color:#666;
  cursor:pointer;
  font-size:13px;
}

.bottom .sel{
  color:#111;
  font-weight:bold;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:20;
  align-items:flex-end;
}

.modal.open{
  display:flex;
}

.sheet{
  background:white;
  width:100%;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow-y:auto;
}

.sheet h2{
  margin-top:0;
}

label{
  display:block;
  font-size:13px;
  color:#555;
  margin:12px 0 5px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:white;
}

.preview{
  height:170px;
  border-radius:14px;
  background:#f1f0ee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:50px;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* LOOKS */

.look{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
}

.lookrow{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-top:12px;
}

.mini{
  min-width:120px;
  background:#f2f1ef;
  border:2px solid transparent;
  border-radius:12px;
  padding:8px;
  cursor:pointer;
  text-align:left;
}

.mini.selected{
  border-color:#171717;
}

.mini .photo{
  height:100px;
  background:transparent;
  font-size:34px;
}

.mini b{
  display:block;
  font-size:13px;
  padding:6px 2px 2px;
}

/* SAVED LOOKS */

.saved-item{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
}

.saved-items{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-top:12px;
}

.saved-mini{
  min-width:95px;
  text-align:center;
  font-size:12px;
}

.saved-mini .photo{
  height:90px;
  border-radius:12px;
  font-size:32px;
}

.delete-button{
  width:100%;
  padding:10px;
  margin-top:14px;
  border:1px solid #ddd;
  background:white;
  border-radius:10px;
  cursor:pointer;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.back-button{
  border:0;
  background:none;
  padding:0;
  font-size:15px;
  cursor:pointer;
  margin-bottom:15px;
}

/* DESKTOP */

@media(min-width:700px){

  .category-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .bottom{
    max-width:700px;
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:100%;
    border-radius:18px 18px 0 0;
  }
}
</style>

</head>

<body>

<header>

<h1>MY WARDROBE</h1>

<input
id="searchInput"
class="search"
type="search"
placeholder="🔍 Search my wardrobe"
autocomplete="off"

>

</header>

<main id="app"></main>

<button
id="fab"
class="fab"
type="button"

>

＋ Add Category </button>

<div class="bottom">

<button
id="wardrobeBtn"
class="sel"
type="button"

>

👕<br>
Wardrobe </button>

<button
id="lookBtn"
type="button"

>

✨<br>
Create Look </button>

<button
id="savedBtn"
type="button"

>

♥<br>
Saved Looks </button>

</div>

<!-- ADD CATEGORY MODAL -->

<div id="categoryModal" class="modal">

<div class="sheet">

<h2>Add Category</h2>

<label for="categoryName">
Category name
</label>

<input
id="categoryName"
type="text"
placeholder="e.g. Shirts, Gym Clothes, Work Clothes"

>

<label for="categoryIcon">
Category icon
</label>

<input
id="categoryIcon"
type="text"
placeholder="e.g. 👕"
maxlength="2"

>

<div class="button-row">

<button
id="cancelCategory"
class="action-button"
type="button"

>

Cancel </button>

<button
id="saveCategory"
class="action-button primary"
type="button"

>

Add Category </button>

</div>

</div>
</div>

<!-- ADD CLOTHES MODAL -->

<div id="clothesModal" class="modal">

<div class="sheet">

<h2>Add Clothes</h2>

<div
  id="preview"
  class="preview"
>
📷
</div>

<label for="photoInput">
Photo
</label>

<input
id="photoInput"
type="file"
accept="image/*"

>

<label for="itemName">
Item name
</label>

<input
id="itemName"
type="text"
placeholder="e.g. White Oxford Shirt"

>

<label>
Category
</label>

<input
id="selectedCategoryDisplay"
type="text"
disabled

>

<label for="itemColor">
Colour
</label>

<input
id="itemColor"
type="text"
placeholder="e.g. White"

>

<label for="itemBrand">
Brand (optional)
</label>

<input
id="itemBrand"
type="text"
placeholder="e.g. Zara"

>

<div class="button-row">

<button
id="cancelClothes"
class="action-button"
type="button"

>

Cancel </button>

<button
id="saveClothes"
class="action-button primary"
type="button"

>

Add to Wardrobe </button>

</div>

</div>
</div>

<script>

/* =========================================
   STORAGE
========================================= */

var CATEGORY_KEY = "myWardrobeCategories";
var ITEM_KEY = "myWardrobeItems";
var LOOK_KEY = "myWardrobeLooks";


function load(key){

  try{

    var data = localStorage.getItem(key);

    if(!data){
      return [];
    }

    return JSON.parse(data);

  }catch(error){

    console.error(error);

    return [];
  }
}


function save(key,data){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(data)
    );

    return true;

  }catch(error){

    console.error(error);

    alert(
      "Your browser could not save this information. " +
      "If you uploaded a large photo, try a smaller image."
    );

    return false;
  }
}


var categories = load(CATEGORY_KEY);
var items = load(ITEM_KEY);
var looks = load(LOOK_KEY);


/* =========================================
   APP STATE
========================================= */

var currentPage = "categories";
var currentCategoryId = null;
var previewData = "";

var selected = {
  shirt:null,
  pants:null,
  shoes:null
};


/* =========================================
   DOM
========================================= */

var app = document.getElementById("app");
var searchInput = document.getElementById("searchInput");
var fab = document.getElementById("fab");

var wardrobeBtn = document.getElementById("wardrobeBtn");
var lookBtn = document.getElementById("lookBtn");
var savedBtn = document.getElementById("savedBtn");


var categoryModal =
  document.getElementById("categoryModal");

var clothesModal =
  document.getElementById("clothesModal");


var categoryName =
  document.getElementById("categoryName");

var categoryIcon =
  document.getElementById("categoryIcon");


var photoInput =
  document.getElementById("photoInput");

var preview =
  document.getElementById("preview");

var itemName =
  document.getElementById("itemName");

var itemColor =
  document.getElementById("itemColor");

var itemBrand =
  document.getElementById("itemBrand");

var selectedCategoryDisplay =
  document.getElementById("selectedCategoryDisplay");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================
   CATEGORY COUNT
========================================= */

function countItems(categoryId){

  var count = 0;

  for(var i=0;i<items.length;i++){

    if(items[i].categoryId === categoryId){
      count++;
    }
  }

  return count;
}


/* =========================================
   RENDER
========================================= */

function render(){

  if(currentPage === "categories"){

    renderCategories();

  }else if(currentPage === "items"){

    renderCategoryItems();

  }else if(currentPage === "looks"){

    renderLooks();

  }else if(currentPage === "saved"){

    renderSavedLooks();
  }
}


/* =========================================
   CATEGORY PAGE
========================================= */

function renderCategories(){

  searchInput.placeholder =
    "🔍 Search categories";

  fab.style.display = "block";
  fab.textContent = "＋ Add Category";


  var query =
    searchInput.value
      .trim()
      .toLowerCase();


  var filtered = categories.filter(
    function(category){

      return category.name
        .toLowerCase()
        .indexOf(query) !== -1;
    }
  );


  var html =
    '<div class="title">' +

      "<h2>My Categories</h2>" +

      '<span class="count">' +
        categories.length +
        " categories" +
      "</span>" +

    "</div>";


  if(filtered.length === 0){

    html +=
      '<div class="empty">' +

        "You haven't created any categories yet." +

        "<br><br>" +

        "Tap ＋ Add Category to create your first one." +

      "</div>";

  }else{

    html +=
      '<div class="category-grid">';


    for(var i=0;i<filtered.length;i++){

      var category = filtered[i];

      html +=

        '<button ' +

          'class="category-card" ' +

          'type="button" ' +

          'data-id="' +
            escapeHTML(category.id) +
          '">' +

          '<div class="category-icon">' +
            escapeHTML(category.icon || "👕") +
          "</div>" +

          '<div class="category-name">' +
            escapeHTML(category.name) +
          "</div>" +

          '<div class="category-count">' +
            countItems(category.id) +
            (
              countItems(category.id) === 1
                ? " item"
                : " items"
            ) +
          "</div>" +

        "</button>";
    }


    html += "</div>";
  }


  app.innerHTML = html;


  var buttons =
    app.querySelectorAll(".category-card");


  for(var j=0;j<buttons.length;j++){

    buttons[j].addEventListener(
      "click",
      function(){

        currentCategoryId =
          this.getAttribute("data-id");

        currentPage = "items";

        searchInput.value = "";

        render();
      }
    );
  }
}


/* =========================================
   CATEGORY ITEMS PAGE
========================================= */

function renderCategoryItems(){

  var category =
    categories.find(
      function(c){
        return String(c.id) === String(currentCategoryId);
      }
    );


  if(!category){

    currentPage = "categories";

    render();

    return;
  }


  searchInput.placeholder =
    "🔍 Search clothes";


  fab.style.display = "block";
  fab.textContent = "＋ Add Clothes";


  var query =
    searchInput.value
      .trim()
      .toLowerCase();


  var categoryItems =
    items.filter(
      function(item){

        var sameCategory =
          String(item.categoryId) ===
          String(currentCategoryId);


        var searchable =
          (
            (item.name || "") +
            " " +
            (item.color || "") +
            " " +
            (item.brand || "")
          ).toLowerCase();


        return (
          sameCategory &&
          searchable.indexOf(query) !== -1
        );
      }
    );


  var html =

    '<button ' +
      'class="back-button" ' +
      'id="backToCategories" ' +
      'type="button">' +
      "← All Categories" +
    "</button>" +


    '<div class="title">' +

      "<h2>" +

        escapeHTML(category.icon || "👕") +
        " " +
        escapeHTML(category.name) +

      "</h2>" +

      '<span class="count">' +
        categoryItems.length +
        " items" +
      "</span>" +

    "</div>";


  if(categoryItems.length === 0){

    html +=

      '<div class="empty">' +

        "This category is empty." +

        "<br><br>" +

        "Tap ＋ Add Clothes to add your first item." +

      "</div>";

  }else{

    html += '<div class="grid">';


    for(var i=0;i<categoryItems.length;i++){

      html += createClothingCard(
        categoryItems[i]
      );
    }


    html += "</div>";
  }


  app.innerHTML = html;


  document
    .getElementById("backToCategories")
    .addEventListener(
      "click",
      function(){

        currentCategoryId = null;
        currentPage = "categories";
        searchInput.value = "";

        render();
      }
    );
}


/* =========================================
   CLOTHING CARD
========================================= */

function createClothingCard(item){

  var imageHTML = item.photo

    ?

      '<img src="' +
      item.photo +
      '" alt="' +
      escapeHTML(item.name) +
      '">'

    :

      escapeHTML(item.emoji || "👕");


  return (

    '<div class="card">' +

      '<div class="photo">' +
        imageHTML +
      "</div>" +

      '<div class="info">' +

        '<div class="name">' +
          escapeHTML(item.name) +
        "</div>" +

        (
          item.color
            ?
              '<div class="meta">' +
                escapeHTML(item.color) +
              "</div>"
            :
              ""
        ) +

        (
          item.brand
            ?
              '<div class="meta">' +
                escapeHTML(item.brand) +
              "</div>"
            :
              ""
        ) +

      "</div>" +

    "</div>"
  );
}


/* =========================================
   ADD CATEGORY
========================================= */

function openCategoryModal(){

  categoryModal.classList.add("open");

  categoryName.focus();
}


function closeCategoryModal(){

  categoryModal.classList.remove("open");

  categoryName.value = "";
  categoryIcon.value = "";
}


function saveCategory(){

  var name =
    categoryName.value.trim();


  if(!name){

    alert(
      "Please enter a category name."
    );

    categoryName.focus();

    return;
  }


  var exists =
    categories.some(
      function(category){

        return category.name
          .toLowerCase() ===
          name.toLowerCase();
      }
    );


  if(exists){

    alert(
      "You already have a category with this name."
    );

    return;
  }


  var newCategory = {

    id:
      "category-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8),

    name:name,

    icon:
      categoryIcon.value.trim() ||
      "👕"
  };


  categories.push(newCategory);


  if(!save(CATEGORY_KEY,categories)){
    return;
  }


  closeCategoryModal();

  searchInput.value = "";

  render();
}


/* =========================================
   ADD CLOTHES
========================================= */

function openClothesModal(){

  var category =
    categories.find(
      function(c){
        return String(c.id) ===
          String(currentCategoryId);
      }
    );


  if(!category){

    alert(
      "Please open a category first."
    );

    return;
  }


  selectedCategoryDisplay.value =
    category.name;


  clothesModal.classList.add("open");

  itemName.focus();
}


function closeClothesModal(){

  clothesModal.classList.remove("open");

  previewData = "";

  photoInput.value = "";

  preview.innerHTML = "📷";

  itemName.value = "";
  itemColor.value = "";
  itemBrand.value = "";
}


photoInput.addEventListener(
  "change",
  function(event){

    var file =
      event.target.files &&
      event.target.files[0];


    if(!file){
      return;
    }


    if(!file.type.startsWith("image/")){

      alert(
        "Please choose an image."
      );

      photoInput.value = "";

      return;
    }


    var reader =
      new FileReader();


    reader.onload =
      function(){

        previewData =
          reader.result;


        preview.innerHTML =
          '<img src="' +
          previewData +
          '" alt="Preview">';
      };


    reader.onerror =
      function(){

        alert(
          "The photo could not be loaded."
        );
      };


    reader.readAsDataURL(file);
  }
);


function getEmoji(categoryName){

  var name =
    categoryName.toLowerCase();


  if(
    name.indexOf("shoe") !== -1 ||
    name.indexOf("foot") !== -1
  ){
    return "👟";
  }


  if(
    name.indexOf("pant") !== -1 ||
    name.indexOf("jean") !== -1 ||
    name.indexOf("short") !== -1
  ){
    return "👖";
  }


  if(
    name.indexOf("jacket") !== -1 ||
    name.indexOf("coat") !== -1
  ){
    return "🧥";
  }


  if(
    name.indexOf("accessor") !== -1
  ){
    return "⌚";
  }


  return "👕";
}


function saveClothes(){

  var name =
    itemName.value.trim();


  if(!name){

    alert(
      "Please enter an item name."
    );

    itemName.focus();

    return;
  }


  var category =
    categories.find(
      function(c){
        return String(c.id) ===
          String(currentCategoryId);
      }
    );


  if(!category){

    alert(
      "Please choose a category first."
    );

    return;
  }


  var newItem = {

    id:
      "item-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8),

    name:name,

    categoryId:
      category.id,

    color:
      itemColor.value.trim(),

    brand:
      itemBrand.value.trim(),

    photo:
      previewData || "",

    emoji:
      getEmoji(category.name)
  };


  items.unshift(newItem);


  if(!save(ITEM_KEY,items)){

    items.shift();

    return;
  }


  closeClothesModal();

  searchInput.value = "";

  render();
}


/* =========================================
   FAB
========================================= */

fab.addEventListener(
  "click",
  function(){

    if(currentPage === "categories"){

      openCategoryModal();

    }else if(currentPage === "items"){

      openClothesModal();
    }
  }
);


/* =========================================
   MODAL BUTTONS
========================================= */

document
  .getElementById("cancelCategory")
  .addEventListener(
    "click",
    closeCategoryModal
  );


document
  .getElementById("saveCategory")
  .addEventListener(
    "click",
    saveCategory
  );


document
  .getElementById("cancelClothes")
  .addEventListener(
    "click",
    closeClothesModal
  );


document
  .getElementById("saveClothes")
  .addEventListener(
    "click",
    saveClothes
  );


categoryModal.addEventListener(
  "click",
  function(event){

    if(event.target === categoryModal){
      closeCategoryModal();
    }
  }
);


clothesModal.addEventListener(
  "click",
  function(event){

    if(event.target === clothesModal){
      closeClothesModal();
    }
  }
);


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  function(){

    render();
  }
);


/* =========================================
   CREATE LOOK
========================================= */

function renderLooks(){

  searchInput.placeholder =
    "🔍 Search my wardrobe";

  fab.style.display = "none";


  var categoryMap = {};


  for(var i=0;i<categories.length;i++){

    categoryMap[categories[i].id] =
      categories[i];
  }


  var availableItems =
    items.filter(
      function(item){

        return categoryMap[item.categoryId];
      }
    );


  var shirts =
    availableItems.filter(
      function(item){

        return categoryMap[item.categoryId]
          .name
          .toLowerCase()
          .indexOf("shirt") !== -1;
      }
    );


  var pants =
    availableItems.filter(
      function(item){

        var n =
          categoryMap[item.categoryId]
            .name
            .toLowerCase();

        return (
          n.indexOf("pant") !== -1 ||
          n.indexOf("jean") !== -1 ||
          n.indexOf("trouser") !== -1
        );
      }
    );


  var shoes =
    availableItems.filter(
      function(item){

        return categoryMap[item.categoryId]
          .name
          .toLowerCase()
          .indexOf("shoe") !== -1;
      }
    );


  var html =

    '<div class="title">' +
      "<h2>Create a Look</h2>" +
    "</div>" +


    '<div class="look">' +
      "<b>1. Choose a shirt</b>" +
      '<div class="lookrow">' +
        createLookItems(shirts,"shirt") +
      "</div>" +
    "</div>" +


    '<div class="look">' +
      "<b>2. Choose pants</b>" +
      '<div class="lookrow">' +
        createLookItems(pants,"pants") +
      "</div>" +
    "</div>" +


    '<div class="look">' +
      "<b>3. Choose shoes</b>" +
      '<div class="lookrow">' +
        createLookItems(shoes,"shoes") +
      "</div>" +
    "</div>" +


    '<button ' +
      'id="saveLookButton" ' +
      'class="primary" ' +
      'type="button" ' +
      'style="width:100%;padding:14px;border-radius:12px;margin-top:16px;border:0;">' +

      "♥ Save This Look" +

    "</button>";


  app.innerHTML = html;


  var buttons =
    app.querySelectorAll(".mini");


  for(var j=0;j<buttons.length;j++){

    buttons[j].addEventListener(
      "click",
      function(){

        chooseLookItem(
          this.getAttribute("data-type"),
          this.getAttribute("data-id")
        );
      }
    );
  }


  document
    .getElementById("saveLookButton")
    .addEventListener(
      "click",
      saveLook
    );
}


function createLookItems(list,type){

  if(list.length === 0){

    return (
      '<div style="padding:15px;color:#777;">' +
        "No matching items yet." +
      "</div>"
    );
  }


  var html = "";


  for(var i=0;i<list.length;i++){

    var item = list[i];


    var imageHTML = item.photo

      ?

        '<img src="' +
        item.photo +
        '" alt="' +
        escapeHTML(item.name) +
        '">'

      :

        escapeHTML(item.emoji || "👕");


    var isSelected =
      selected[type] &&
      selected[type].id === item.id;


    html +=

      '<button ' +
        'type="button" ' +
        'class="mini ' +
        (isSelected ? "selected" : "") +
        '" ' +
        'data-type="' +
        escapeHTML(type) +
        '" ' +
        'data-id="' +
        escapeHTML(item.id) +
        '">' +

        '<div class="photo">' +
          imageHTML +
        "</div>" +

        "<b>" +
          escapeHTML(item.name) +
        "</b>" +

      "</button>";
  }


  return html;
}


function chooseLookItem(type,id){

  var found =
    items.find(
      function(item){
        return String(item.id) === String(id);
      }
    );


  selected[type] = found || null;

  render();
}


function saveLook(){

  var chosen = [];


  if(selected.shirt){
    chosen.push(selected.shirt);
  }

  if(selected.pants){
    chosen.push(selected.pants);
  }

  if(selected.shoes){
    chosen.push(selected.shoes);
  }


  if(chosen.length < 2){

    alert(
      "Choose at least two items first."
    );

    return;
  }


  looks.unshift(chosen);


  if(!save(LOOK_KEY,looks)){
    return;
  }


  selected = {
    shirt:null,
    pants:null,
    shoes:null
  };


  showSaved();
}


/* =========================================
   SAVED LOOKS
========================================= */

function renderSavedLooks(){

  searchInput.placeholder =
    "🔍 Search my wardrobe";

  fab.style.display = "none";


  var html =

    '<div class="title">' +

      "<h2>Saved Looks</h2>" +

      '<span class="count">' +
        looks.length +
      "</span>" +

    "</div>";


  if(looks.length === 0){

    html +=

      '<div class="empty">' +

        "No saved looks yet." +

        "<br><br>" +

        "Create a look and save it here." +

      "</div>";


    app.innerHTML = html;

    return;
  }


  for(var i=0;i<looks.length;i++){

    var look =
      looks[i];


    html +=

      '<div class="saved-item">' +

        "<b>Look " +
          (i+1) +
        "</b>" +

        '<div class="saved-items">';


    for(var j=0;j<look.length;j++){

      var item =
        look[j];


      var imageHTML = item.photo

        ?

          '<img src="' +
          item.photo +
          '" alt="' +
          escapeHTML(item.name) +
          '">'

        :

          escapeHTML(item.emoji || "👕");


      html +=

        '<div class="saved-mini">' +

          '<div class="photo">' +
            imageHTML +
          "</div>" +

          "<div>" +
            escapeHTML(item.name) +
          "</div>" +

        "</div>";
    }


    html +=

        "</div>" +

        '<button ' +
          'class="delete-button" ' +
          'type="button" ' +
          'data-index="' +
          i +
          '">' +

          "Delete Look" +

        "</button>" +

      "</div>";
  }


  app.innerHTML = html;


  var deleteButtons =
    app.querySelectorAll(".delete-button");


  for(var k=0;k<deleteButtons.length;k++){

    deleteButtons[k].addEventListener(
      "click",
      function(){

        deleteLook(
          parseInt(
            this.getAttribute("data-index"),
            10
          )
        );
      }
    );
  }
}


function deleteLook(index){

  if(!confirm("Delete this saved look?")){
    return;
  }


  looks.splice(index,1);

  save(LOOK_KEY,looks);

  render();
}


/* =========================================
   BOTTOM NAVIGATION
========================================= */

function updateNavigation(){

  wardrobeBtn.classList.remove("sel");
  lookBtn.classList.remove("sel");
  savedBtn.classList.remove("sel");


  if(
    currentPage === "categories" ||
    currentPage === "items"
  ){
    wardrobeBtn.classList.add("sel");
  }


  if(currentPage === "looks"){
    lookBtn.classList.add("sel");
  }


  if(currentPage === "saved"){
    savedBtn.classList.add("sel");
  }
}


wardrobeBtn.addEventListener(
  "click",
  function(){

    currentPage = "categories";
    currentCategoryId = null;
    searchInput.value = "";

    updateNavigation();
    render();
  }
);


lookBtn.addEventListener(
  "click",
  function(){

    currentPage = "looks";
    searchInput.value = "";

    updateNavigation();
    render();
  }
);


savedBtn.addEventListener(
  "click",
  function(){

    currentPage = "saved";
    searchInput.value = "";

    updateNavigation();
    render();
  }
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      if(categoryModal.classList.contains("open")){
        closeCategoryModal();
      }

      if(clothesModal.classList.contains("open")){
        closeClothesModal();
      }
    }
  }
);


/* =========================================
   START
========================================= */

updateNavigation();
render();


/* =========================================
   SERVICE WORKER
========================================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./service-worker.js")
        .then(function(){

          console.log(
            "My Wardrobe service worker registered."
          );

        })
        .catch(function(error){

          console.log(
            "Service worker registration failed:",
            error
          );
        });
    }
  );
}

</script>
