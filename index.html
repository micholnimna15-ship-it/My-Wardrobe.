  /* =========================================================

  function showLogin() {

    document
      .getElementById("loginForm")
      .classList.remove("hidden");

    document
      .getElementById("signupForm")
      .classList.add("hidden");

  }


  function showSignup() {

    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("signupForm")
      .classList.remove("hidden");

  }


  async function signup() {

    const email =
      document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("signupPassword")
        .value;


    if (!email || !password) {

      alert(
        "Please enter your email and password."
      );

      return;
    }


    if (password.length < 6) {

      alert(
        "Password must be at least 6 characters."
      );

      return;
    }


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email,
          password
        });


      if (error) {
        throw error;
      }


      if (data.session) {

        currentUser =
          data.user;

        await startApp();

      } else {

        alert(
          "Account created. Please check your email if email confirmation is enabled, then log in."
        );

        showLogin();

      }

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Unable to create account."
      );

    }

  }


  async function login() {

    const email =
      document

  }

  async function startApp() {

    if (appStarted || appStarting) {
      return;
    }


    if (!currentUser) {
      return;
    }


    appStarting = true;


    try {

      document
        .getElementById("authScreen")
        .classList.add("hidden");


      document
        .getElementById("appScreen")
        .classList.remove("hidden");


      await loadAllData();

      loadShoppingProfile();

      updateStoreList();

      showPage("home");

      appStarted = true;

    } catch (error) {

      console.error(error);

      alert(
        "There was a problem loading your wardrobe. Please refresh and try again."
      );

    } finally {

      appStarting = false;

    }

  }


  async function loadAllData() {

    if (!currentUser) {
      return;
    }


    const [
      categoryResult,
      clothingResult,
      lookResult,
      lookItemsResult
    ] =
      await Promise.all([

        supabaseClient
          .from("categories")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          ),

        supabaseClient
          .from("clothing_items")
          .select("*")
          .order(
            "created_at",
            {
              ascending: true
            }
          ),

        supabaseClient
          .from("saved_looks")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          ),

        supabaseClient
          .from("look_items")
          .select("*")

      ]);


    if (categoryResult.error) {
      throw categoryResult.error;
    }


    if (clothingResult.error) {
      throw clothingResult.error;
    }


    if (lookResult.error) {
      throw lookResult.error;
    }


    if (lookItemsResult.error) {
      throw lookItemsResult.error;
    }


    categories =
      categoryResult.data || [];


    clothingItems =
      clothingResult.data || [];


    savedLooks =
      lookResult.data || [];


    lookItems =
      lookItemsResult.data || [];


    await createSignedPhotoUrls();

    renderCategories();

  }


  async function createSignedPhotoUrls() {

    for (const item of clothingItems) {

      if (!item.photo_url) {
        continue;
      }


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .createSignedUrl(
              item.photo_url,
              3600
            );


        if (!error && data) {

          item.signed_photo_url =
            data.signedUrl;

        }

      } catch (error) {

        console.error(
          "Photo URL error:",
          error
        );

      }

    }

  }

  async function saveCategory() {

    const name =
      document
        .getElementById(
          "categoryName"
        )
        .value
        .trim();


    const icon =
      document
        .getElementById(
          "categoryIcon"
        )
        .value
        .trim() ||
      "👕";


    if (!name) {

      alert(
        "Please enter a category name."
      );

      return;
    }


    try {

      let error;


      if (editingCategoryId) {

        const result =
          await supabaseClient
            .from("categories")
            .update({
              name,
              icon
            })
            .eq(
              "id",
              editingCategoryId
            );


        error =
          result.error;

      } else {

        const result =
          await supabaseClient
            .from("categories")
            .insert({
              user_id:
                currentUser.id,

              name,
              icon
            });


        error =
          result.error;

      }


      if (error) {
        throw error;
      }


      closeModal(
        "categoryModal"
      );


      await loadAllData();


      if (currentCategoryId) {

        openCategory(
          currentCategoryId
        );

      }

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Unable to save category."
      );

    }

  }

  async function confirmDeleteCategory() {

    if (!currentCategoryId) {
      return;
    }


    const category =
      categories.find(
        item =>
          item.id ===
          currentCategoryId
      );


    if (!category) {
      return;
    }


    const confirmed =
      confirm(
        `Delete "${category.name}" and all clothing inside it?`
      );


    if (!confirmed) {
      return;
    }


    await deleteCurrentCategory();

  }


  async function deleteCurrentCategory() {

    try {

      const items =
        clothingItems.filter(
          item =>
            item.category_id ===
            currentCategoryId
        );


      const paths =
        items
          .map(
            item =>
              item.photo_url
          )
          .filter(Boolean);


      if (paths.length) {

        const {
          error:
            storageError
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .remove(paths);


        if (storageError) {

          console.warn(
            "Some photos could not be deleted:",
            storageError
          );

        }

      }


      if (items.length) {

        const {
          error
        } =
          await supabaseClient
            .from("clothing_items")
            .delete()
            .eq(
              "category_id",
              currentCategoryId
            );


        if (error) {
          throw error;
        }

      }


      const {
        error
      } =
        await supabaseClient
          .from("categories")
          .delete()
          .eq(
            "id",
            currentCategoryId
          );


      if (error) {
        throw error;
      }


      currentCategoryId = null;


      await loadAllData();

      showPage("home");

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Unable to delete category."
      );

    }

  }

        "saveClothingButton"

    button.textContent =
      "Saving...";


    let uploadedPath =
      null;


    try {

      const categoryId =
        document
          .getElementById(
            "clothingCategory"
          )
          .value;


      const name =
        document
          .getElementById(
            "clothingName"
          )
          .value

      const color =

          .getElementById(
            "clothingColor"

      if (!categoryId) {

        );

      }


      if (!name) {

        throw new Error(
          "Please enter a clothing name."
        );

      }


      const photoInput =
        document.getElementById(
          "clothingPhoto"
        );


      const file =
        photoInput.files[0];


      let photoUrl = null;


      if (editingClothingId) {

        const existing =
          clothingItems.find(
            item =>
              item.id ===
              editingClothingId
          );


        photoUrl =
          existing
            ? existing.photo_url
            : null;

      }


      if (file) {

        const safeName =
          file.name
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        uploadedPath =
          `${currentUser.id}/${crypto.randomUUID()}-${safeName}`;


        const {
          error:
            uploadError
        } =
          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .upload(
              uploadedPath,
              file,
              {
                upsert: false
              }
            );


        if (uploadError) {
          throw uploadError;
        }


        photoUrl =
          uploadedPath;

      }


      let error;


      if (editingClothingId) {

        const result =
          await supabaseClient
            .from("clothing_items")
            .update({
              category_id:
                categoryId,

              name,

              color,

              brand,

              photo_url:
                photoUrl
            })
            .eq(
              "id",
              editingClothingId
            );


        error =
          result.error;

      } else {

        const result =
          await supabaseClient
            .from("clothing_items")
            .insert({
              user_id:
                currentUser.id,

              category_id:
                categoryId,

              name,

              color,

              brand,

              photo_url:
                photoUrl
            });


        error =
          result.error;

      }


      if (error) {
        throw error;
      }


      closeModal(
        "clothingModal"
      );


      await loadAllData();


      if (currentCategoryId) {

        renderClothingForCategory();

      }

    } catch (error) {

      console.error(error);


      if (uploadedPath) {

        try {

          await supabaseClient
            .storage
            .from("wardrobe-photos")
            .remove([
              uploadedPath
            ]);

        } catch (cleanupError) {

          console.error(
            "Photo cleanup failed:",
            cleanupError
          );

        }

      }


      alert(
        error.message ||
        "Unable to save clothing."
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Save Clothing";

    }

  }


  async function deleteClothing(id) {

    const confirmed =
      confirm(
        "Delete this clothing item?"
      );


    if (!confirmed) {
      return;
    }


    try {

      const item =
        clothingItems.find(
          x =>
            x.id === id
        );


      if (
        item &&
        item.photo_url
      ) {

        await supabaseClient
          .storage
          .from("wardrobe-photos")
          .remove([
            item.photo_url
          ]);

      }


      const {
        error
      } =
        await supabaseClient
          .from("clothing_items")
          .delete()
          .eq(
            "id",
            id
          );


      if (error) {
        throw error;
      }


      await loadAllData();


      if (currentCategoryId) {

        renderClothingForCategory();

      }

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Unable to delete clothing."
      );

    }

  }

  async function createSavedLook() {

    const name =
      document
        .getElementById(
          "lookName"
        )
        .value
        .trim();


    if (!name) {

      alert(
        "Please enter a look name."
      );

      return;
    }


    if (!clothingItems.length) {

      alert(
        "Add some clothing before creating a look."
      );

      return;
    }


    try {

      const categoriesAvailable =
        [
          ...new Set(
            clothingItems.map(
              item =>
                item.category_id
            )
          )
        ];


      categoriesAvailable.sort(
        () =>
          Math.random() -
          0.5
      );


      const selectedCategoryIds =
        categoriesAvailable.slice(
          0,
          3
        );


      let selectedItems = [];


      selectedCategoryIds.forEach(
        categoryId => {

          const available =
            clothingItems.filter(
              item =>
                item.category_id ===
                categoryId
            );


          if (available.length) {

            const item =
              available[
                Math.floor(
                  Math.random() *
                  available.length
                )
              ];


            selectedItems.push(
              item
            );

          }

        }
      );


      if (
        selectedItems.length <
        3
      ) {

        const remaining =
          clothingItems.filter(
            item =>
              !selectedItems.some(
                selected =>
                  selected.id ===
                  item.id
              )
          );


        remaining.sort(
          () =>
            Math.random() -
            0.5
        );


        selectedItems =
          selectedItems.concat(
            remaining.slice(
              0,
              3 -
              selectedItems.length
            )
          );

      }


      const {
        data: look,
        error: lookError
      } =
        await supabaseClient
          .from("saved_looks")
          .insert({
            user_id:
              currentUser.id,

            name
          })
          .select()
          .single();


      if (lookError) {
        throw lookError;
      }


      if (selectedItems.length) {

        const rows =
          selectedItems.map(
            item => ({
              look_id:
                look.id,

              clothing_item_id:
                item.id
            })
          );


        const {
          error
        } =
          await supabaseClient
            .from("look_items")
            .insert(rows);


        if (error) {
          throw error;
        }

      }


      closeModal(
        "saveLookModal"
      );


      await loadAllData();

      showPage("looks");

    } catch (error) {

      console.error(error);

      alert(
        error.message ||
        "Unable to create look."
      );

    }

  }

          return `

  function toggleStore(
    storeId,
    checked
  ) {

    let ids =
      getSelectedStoreIds();


    if (checked) {

      if (
        !ids.includes(
          storeId
        )
      ) {

        ids.push(
          storeId
        );

      }

    } else {

      ids =
        ids.filter(
          id =>
            id !==
            storeId
        );

    }


    saveSelectedStoreIds(
      ids
    );


    updateStoreList();

  }

      country:
        document
          .getElementById(
            "profileCountry"
          )
          .value,

      url:
        safe,

      custom:

    try {

      localStorage.setItem(

        )
      );

  /* =========================================================

  ========================================================= */

  function analyseWardrobeForShopping(
    request,
    occasion
  ) {

    const combinedText =
      `${request || ""} ${
        occasion || ""
      }`
        .toLowerCase();


    if (!clothingItems.length) {

      return {

        summary:
          "Your wardrobe is currently empty, so the shopping search will focus on building a complete outfit.",

        ownedItems: [],

        ownedCategories: [],

        ownedColours: [],

        relevantItems: []

      };

    }


    const ownedItems =
      clothingItems.map(
        item => {

          const category =
            categories.find(
              cat =>
                cat.id ===
                item.category_id
            );


          return {

            id:
              item.id,

            name:
              item.name ||
              "",

            brand:
              item.brand ||
              "",

            color:
              item.color ||
              "",

            category:
              category
                ? category.name
                : ""

          };

        }
      );


    const ownedCategories =
      [
        ...new Set(
          ownedItems
            .map(
              item =>
                item.category
            )
            .filter(Boolean)
        )
      ];


    const ownedColours =
      [
        ...new Set(
          ownedItems
            .map(
              item =>
                item.color
            )
            .filter(Boolean)
        )
      ];


    const relevantItems =
      ownedItems.filter(
        item => {

          const itemText =
            [
              item.name,
              item.brand,
              item.color,
              item.category
            ]
              .filter(Boolean)
              .join(" ")
              .toLowerCase();


          const keywords =
            getShoppingKeywords(
              combinedText
            );


          return keywords.some(
            keyword =>
              itemText.includes(
                keyword
              )
          );

        }
      );


    let summary = "";


    if (relevantItems.length) {

      summary =
        `Potentially useful items you already own: ${
          relevantItems
            .slice(0, 8)
            .map(
              item =>
                item.name
            )
            .join(", ")
        }.`;

    } else {

      summary =
        `You already have ${
          clothingItems.length
        } clothing item${
          clothingItems.length === 1
            ? ""
            : "s"
        } in your wardrobe. The search will focus on pieces that can work with your existing wardrobe.`;

    }


    return {

      summary,

      ownedItems,

      ownedCategories,

      ownedColours,

      relevantItems

    };

  }


  /* =========================================================
     SHOPPING KEYWORDS
  ========================================================= */

  function getShoppingKeywords(
    text
  ) {

    const allKeywords = [

      "shirt",
      "tshirt",
      "t-shirt",
      "polo",
      "blazer",
      "jacket",
      "suit",
      "trouser",
      "trousers",
      "pants",
      "jeans",
      "shorts",
      "dress",
      "skirt",
      "top",
      "jumper",
      "sweater",
      "hoodie",
      "coat",
      "vest",
      "shoes",
      "shoe",
      "sneakers",
      "sneaker",
      "boots",
      "boot",
      "loafer",
      "tie",
      "belt",
      "bag",
      "watch"

    ];


    return allKeywords.filter(
      keyword =>
        text.includes(
          keyword
        )
    );

  }


  /* =========================================================
     SHOPPING PLAN
  ========================================================= */

  function buildShoppingPlan(
    request,
    occasion,
    budget,
    profile,
    wardrobeAnalysis
  ) {

    const occasionText =
      occasion ||
      "your occasion";


    let plan =
      `For ${occasionText}, I'll look for pieces that match your request`;


    if (profile.fit) {

      plan +=
        `, ${profile.fit} fit`;

    }


    if (profile.size) {

      plan +=
        `, around size ${profile.size}`;

    }


    if (budget) {

      plan +=
        ` and stay around your $${budget} maximum`;

    }


    plan += ".";


    if (
      wardrobeAnalysis
        .relevantItems
        .length
    ) {

      plan +=
        " I'll prioritise items that complement pieces you already own.";

    } else {

      plan +=
        " I'll try to build a practical outfit around the request rather than assuming you need to replace your whole wardrobe.";

    }


    return plan;

  }


  /* =========================================================
     SMART STORE SEARCH
  ========================================================= */

  function buildSmartStoreSearch(
    store,
    request,
    occasion,
    budget,
    profile,
    wardrobeAnalysis
  ) {

    const country =
      profile.country ||
      "";


    const lowerRequest =
      (
        request || ""
      )
        .toLowerCase();


    const lowerOccasion =
      (
        occasion || ""
      )
        .toLowerCase();


    let items = [];


    /*
      Occasion-based item suggestions.
    */

    if (
      lowerOccasion.includes(
        "wedding"
      )
    ) {

      items = [
        "wedding",
        "formal",
        "elegant",
        "dress shirt",
        "blazer",
        "trousers"
      ];

    } else if (
      lowerOccasion.includes(
        "date"
      )
    ) {

      items = [
        "date night",
        "smart casual",
        "shirt",
        "trousers",
        "smart shoes"
      ];

    } else if (
      lowerOccasion.includes(
        "work"
      )
    ) {

      items = [
        "workwear",
        "business casual",
        "shirt",
        "trousers",
        "blazer"
      ];

    } else if (
      lowerOccasion.includes(
        "party"
      )
    ) {

      items = [
        "party",
        "smart casual",
        "shirt",
        "trousers"
      ];

    } else if (
      lowerOccasion.includes(
        "vacation"
      )
    ) {

      items = [
        "vacation",
        "resort",
        "casual",
        "shirt",
        "shorts"
      ];

    } else {

      items = [
        "clothing",
        "outfit"
      ];

    }


    /*
      Add useful words from user's request.
    */

    const requestKeywords =
      getShoppingKeywords(
        lowerRequest
      );


    requestKeywords
      .slice(0, 4)
      .forEach(
        keyword => {

          if (
            !items.includes(
              keyword
            )
          ) {

            items.push(
              keyword
            );

          }

        }
      );


    /*
      If wardrobe already contains
      certain pieces, search for complementary
      pieces rather than duplicates.
    */

    const ownedCategories =
      wardrobeAnalysis
        .ownedCategories
        .map(
          category =>
            category.toLowerCase()
        );


    if (
      ownedCategories.some(
        category =>
          category.includes(
            "trouser"
          ) ||
          category.includes(
            "pants"
          )
      )
    ) {

      items.push(
        "shirt",
        "blazer"
      );

    }


    if (
      ownedCategories.some(
        category =>
          category.includes(
            "shirt"
          )
      )
    ) {

      items.push(
        "trousers",
        "blazer"
      );

    }


    if (
      ownedCategories.some(
        category =>
          category.includes(
            "shoe"
          )
      )
    ) {

      items.push(
        "shirt",
        "trousers",
        "blazer"
      );

    }


    /*
      Remove duplicates.
    */

    items =
      [
        ...new Set(
          items
        )
      ];


    /*
      Limit query length.
    */

    items =
      items.slice(
        0,
        10
      );


    let query =
      items.join(" ");


    /*
      Add fit.
    */

    if (profile.fit) {

      query +=
        ` ${profile.fit} fit`;

    }


    /*
      Add size.
    */

    if (profile.size) {

      query +=
        ` size ${profile.size}`;

    }


    /*
      Add country when useful.
    */

    if (country) {

      query +=
        ` ${country}`;

    }


    /*
      Do not put the budget directly into
      every search because retailer search
      engines may interpret it poorly.

      We display the budget separately.
    */


    const description =
      createStoreSearchDescription(
        occasion,
        request,
        profile,
        budget,
        wardrobeAnalysis
      );


    return {

      query:
        query
          .replace(
            /\s+/g,
            " "
          )
          .trim(),

      description

    };

  }


  function createStoreSearchDescription(
    occasion,
    request,
    profile,
    budget,
    wardrobeAnalysis
  ) {

    let description = "";


    if (occasion) {

      description +=
        `${occasion} outfit`;

    } else {

      description +=
        "Outfit matching your request";

    }


    if (request) {

      description +=
        ` — ${request}`;

    }


    if (
      profile.fit ||
      profile.size
    ) {

      description +=
        ". ";


      if (profile.fit) {

        description +=
          `${profile.fit} fit`;

      }


      if (
        profile.fit &&
        profile.size
      ) {

        description +=
          ", ";

      }


      if (profile.size) {

        description +=
          `size ${profile.size}`;

      }

    }


    if (budget) {

      description +=
        `. Maximum budget $${budget}`;

    }


    if (
      wardrobeAnalysis
        .relevantItems
        .length
    ) {

      description +=
        `. Search prioritises pieces that can complement your existing ${wardrobeAnalysis.relevantItems.slice(0, 3).map(item => item.name).join(", ")}.`;

    }


    return description;

  }


  /* =========================================================
     OFFICIAL STORE SEARCH URL
  ========================================================= */

  function buildOfficialSearchUrl(
    store,
    searchText
  ) {

    const domain =
      getStoreDomain(
        store.url
      );


    if (!domain) {

      return safeUrl(
        store.url
      ) || "#";

    }


    /*
      Search Google but restrict results
      to the official retailer domain.

      Example:

      site:countryroad.com.au
      wedding blazer shirt trousers
    */

    const googleQuery =
      `site:${domain} ${searchText}`;


    return (
      "https://www.google.com/search?q=" +
      encodeURIComponent(
        googleQuery
      )
    );

  }


  function getStoreDomain(
    storeUrl
  ) {

    try {

      const url =
        new URL(
          storeUrl
        );


      return url.hostname
        .replace(
          /^www\./,
          ""
        );

    } catch (error) {

      return "";

    }

  }


  /* =========================================================
     LIVE SHOPPING RESULTS
  ========================================================= */

  function renderLiveShoppingResults(
    data
  ) {

    const results =
      document.getElementById(
        "shoppingResults"
      );


    const products =
      Array.isArray(data)
        ? data
        : Array.isArray(
            data.products
          )
          ? data.products
          : [];


    if (!products.length) {

      results.innerHTML = `

        <div class="empty-state">

          No live products were returned.

        </div>

      `;

      return;
    }


    results.innerHTML =
      products
        .map(
          product => {

            const productUrl =
              safeUrl(
                product.productUrl ||
                product.url
              );


            return `

              <div class="result-card">

                ${
                  product.image
                  ?
                  `<img
                    class="result-image"
                    src="${safeAttributeUrl(
                      product.image
                    )}"
                    alt="${escapeHtml(
                      product.name ||
                      "Product"
                    )}"
                  >`
                  :
                  ""
                }

                <h3>
                  ${escapeHtml(
                    product.name ||
                    "Product"
                  )}
                </h3>

                ${
                  product.store
                  ?
                  `<p>
                    Store:
                    ${escapeHtml(
                      product.store
                    )}
                  </p>`
                  :
                  ""
                }

                ${
                  product.price
                  ?
                  `<p>
                    Price:
                    ${escapeHtml(
                      String(
                        product.price
                      )
                    )}
                  </p>`
                  :
                  ""
                }

                ${
                  product.reason
                  ?
                  `<p>
                    ${escapeHtml(
                      product.reason
                    )}
                  </p>`
                  :
                  ""
                }

                ${
                  productUrl
                  ?
                  `<a
                    class="result-btn"
                    href="${safeAttributeUrl(
                      productUrl
                    )}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    View Exact Product
                  </a>`
                  :
                  ""
                }

              </div>

            `;

          }
        )
        .join("");

  }


  /* =========================================================
     MODALS
  ========================================================= */

  function closeModal(id) {

    document
      .getElementById(id)
      .classList.add(
        "hidden"
      );

  }


  document
    .querySelectorAll(
      ".modal"
    )
    .forEach(
      modal => {

        modal.addEventListener(
          "click",
          event => {

            if (
              event.target ===
              modal
            ) {

              modal.classList.add(
                "hidden"
              );

            }

          }
        );

      }
    );


  /* =========================================================
     SECURITY / HELPERS
  ========================================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeJs(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /\\/g,
        "\\\\"
      )
      .replace(
        /'/g,
        "\\'"
      )
      .replace(
        /\n/g,
        "\\n"
      )
      .replace(
        /\r/g,
        "\\r"
      );

  }


  function safeUrl(
    value
  ) {

    try {

      const url =
        new URL(
          String(value)
        );


      if (
        url.protocol !==
          "https:" &&
        url.protocol !==
          "http:"
      ) {

        return null;

      }


      return url.href;

    } catch (error) {

      return null;

    }

  }


  function safeAttributeUrl(
    value
  ) {

    const url =
      safeUrl(
        value
      );


    return url
      ? escapeHtml(
          url
        )
      : "#";

  }


  /* =========================================================
     AUTH STATE
  ========================================================= */

  supabaseClient.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        console.log(
          "Auth event:",
          event
        );


        if (session?.user) {

          currentUser =
            session.user;


          if (!appStarted) {

            await startApp();

          }

        } else {

          currentUser =
            null;

          appStarted =
            false;

          appStarting =
            false;


          document
            .getElementById(
              "appScreen"
            )
            .classList.add(
              "hidden"
            );


          document
            .getElementById(
              "authScreen"
            )
            .classList.remove(
              "hidden"
            );

        }

      }
    );


  /* =========================================================
     INITIAL SESSION CHECK
  ========================================================= */

  async function checkSession() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getSession();


      if (error) {
        throw error;
      }


      if (
        data.session?.user
      ) {

        currentUser =
          data.session.user;


        await startApp();

      } else {

        document
          .getElementById(
            "authScreen"
          )
          .classList.remove(
            "hidden"
          );


        document
          .getElementById(
            "appScreen"
          )
          .classList.add(
            "hidden"
          );

      }

    } catch (error) {

      console.error(
        "Session error:",
        error
      );


      document
        .getElementById(
          "authScreen"
        )
        .classList.remove(
          "hidden"
        );


      document
        .getElementById(
          "appScreen"
        )
        .classList.add(
          "hidden"
        );

    }

  }


  /* =========================================================
     SERVICE WORKER
  ========================================================= */

  if (
    "serviceWorker" in
    navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .then(
            registration => {

              console.log(
                "Service worker registered:",
                registration.scope
              );

            }
          )
          .catch(
            error => {

              console.warn(
                "Service worker registration failed:",
                error
              );

            }
          );

      }
    );

  }


  /* =========================================================
     START
  ========================================================= */

  checkSession();

</script>
